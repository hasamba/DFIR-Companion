# DFIR Companion — Docker Compose.
#
# Localhost-only by design: the container binds 0.0.0.0 internally (DFIR_HOST) and the port is
# published to 127.0.0.1 on the HOST, so it is never exposed on your machine's network interfaces.
# Forensic evidence + case state persist in ./cases on the host. The pre-built browser add-on is
# written to ./addon so you can load it unpacked into Chrome/Comet.
#
# No Ollama / LiteLLM here. For AI, point DFIR_AI_* at any OpenAI-compatible endpoint (a model you
# host, a remote provider, or an Ollama/LiteLLM you run separately).
#
#   docker compose build         # build from source
#   docker compose up -d         # start → http://127.0.0.1:4773/dashboard
#   docker compose pull          # OR pull the prebuilt image from GHCR instead of building
#   docker compose --profile presidio up -d   # ALSO start the optional Presidio analyzer (#2197)

services:
  companion:
    # Build from source (default). Comment out `build:` to use the GHCR image only. The tag is
    # pinned to this checkout's release version so `docker compose pull` matches your source,
    # instead of grabbing whatever was published most recently.
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/hasamba/dfir-companion:0.44.0
    container_name: dfir-companion
    restart: unless-stopped
    # HOST:CONTAINER — bound to 127.0.0.1 on the host so the dashboard is localhost-only.
    # If you change DFIR_PORT below, change the CONTAINER side of this mapping to the same value.
    ports:
      - "127.0.0.1:4773:4773"
    environment:
      DFIR_HOST: "0.0.0.0"
      # The published port above is host-loopback-only. This exact value is the sole exception to
      # the server's refusal to expose unauthenticated single-user mode on a non-loopback bind.
      DFIR_ALLOW_UNAUTHENTICATED_REMOTE: "container-loopback-proxy"
      DFIR_PORT: "4773"
      DFIR_CASES_ROOT: "/data/cases"
      DFIR_MAX_BODY_MB: "256"
      # --- AI analysis (optional). Leave DFIR_VISION_PROVIDER unset for capture/import-only. ---
      # DFIR_VISION_* is the SCREENSHOT (vision) model; DFIR_AI_SYNTH_* does all text work.
      # (Legacy DFIR_AI_PROVIDER/MODEL/KEY/BASE_URL still work as a deprecated fallback.)
      # DFIR_VISION_PROVIDER: "openai"
      # DFIR_VISION_MODEL: "gpt-4o"
      # DFIR_VISION_KEY: "sk-replace-me"
      # Reach an AI endpoint on the host (Docker Desktop): http://host.docker.internal:PORT/v1
      # e.g. a local Ollama:  DFIR_VISION_PROVIDER=ollama  DFIR_VISION_BASE_URL=http://host.docker.internal:11434/v1
      # DFIR_VISION_BASE_URL: "http://host.docker.internal:11434/v1"
      # --- Real-name masking (optional). Start the analyzer with `--profile presidio`, then: ---
      # DFIR_PRESIDIO_URL: "http://presidio-analyzer:3000"
    # Prefer a file for config? Copy companion/.env.example to .env and uncomment:
    # env_file:
    #   - .env
    # Linux only (no Docker Desktop): make host.docker.internal resolve to the host gateway.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # The entrypoint starts as root only to hand the data to an unprivileged user, then drops
    # privileges before the server runs. It runs the server AS THE OWNER of ./cases: if you
    # pre-create ./cases (and ./addon) as your own user, the container uses your UID and your
    # files stay yours; a fresh, Docker-created (root-owned) mount instead falls back to the
    # image's `node` user. Either way the server never parses evidence as root.
    # Hardening (#2155): no-new-privileges stops a SUID binary from regaining root after the drop.
    # Every capability is dropped except the five the ROOT entrypoint needs before it drops
    # privileges: CHOWN + FOWNER + DAC_OVERRIDE to hand ./cases and ./addon (which may be owned by
    # your host user) to the run user, SETUID + SETGID for setpriv to switch to it. Once setpriv
    # runs, the server's effective capability set is empty. `cap_drop: [ALL]` without these
    # cap_add entries stops the container from starting.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - ./cases:/data/cases     # forensic evidence + case state (persists across restarts)
      - ./addon:/out            # pre-built browser add-on → Chrome/Comet "Load unpacked" ./addon/dist
    healthcheck:
      # Probe /health, not /dashboard: /health is auth- and host-check-exempt, so the probe stays
      # green in team mode too (an unauthenticated /dashboard fetch gets a 401 there, and this
      # compose healthcheck OVERRIDES the image's baked /health probe). It reads the same port
      # variables as the image probe (PORT, then DFIR_PORT, then 4773), so changing DFIR_PORT
      # does not leave it probing a dead port and reporting a healthy server as unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||process.env.DFIR_PORT||4773)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional Microsoft Presidio Analyzer (#2197) — finds real names, non-Israeli national IDs and
  # IBANs that the built-in masking cannot. OFF unless you ask for it: the `presidio` profile keeps
  # a plain `docker compose up -d` from pulling this ~1 GB image. Start it with
  #   docker compose --profile presidio up -d                      # alongside the containerised companion
  #   docker compose --profile presidio up -d presidio-analyzer    # analyzer only (companion run with npm)
  # and stop it with `docker compose --profile presidio down` — dropping the flag does not stop it.
  # Starting the analyzer does not turn scanning on: set DFIR_PRESIDIO_URL as well (above, or in
  # Settings → AI → Presidio), to http://presidio-analyzer:3000 from the containerised companion or
  # http://localhost:5002 from a companion run on the host. The companion has no depends_on here on
  # purpose: a dependency on a service whose profile is off makes the whole file invalid.
  presidio-analyzer:
    # Pinned, like the companion image: `latest` would change the detector under a running case.
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    # No container_name: the old manual's `docker run --name presidio-analyzer` would collide with
    # it. The companion reaches this service by its service name, which Compose DNS resolves anyway.
    profiles: ["presidio"]
    restart: unless-stopped
    # Presidio reads case text — masked, but still the timeline — so its port is host-loopback only.
    ports:
      - "127.0.0.1:5002:3000"
    environment:
      # gunicorn kills a worker after 30 s by default, which is shorter than the companion's 60 s
      # per-request budget (DFIR_PRESIDIO_TIMEOUT_MS). Keep this above that budget, or a slow scan
      # dies on the analyzer side and reads as a connection failure.
      GUNICORN_CMD_ARGS: "--timeout 120"
    # The image already runs as an unprivileged user (UID 1001) with no root entrypoint, so it needs
    # no capabilities at all.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # spaCy loads a ~500 MB model before the first answer.
      start_period: 60s
