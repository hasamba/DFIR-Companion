# DFIR Companion — content-based event tagger ruleset (Timesketch tagger analyzer, ported).
#
# Each top-level key is a rule id. A rule names one or more condition blocks and the actions to apply
# to every matching event:
#
#   any:   [ {field, <op>}, ... ]   # OR  — at least one condition must match
#   all:   [ {field, <op>}, ... ]   # AND — every condition must match
#   none:  [ {field, <op>}, ... ]   # NOT — no condition may match
#   tags:      ['label', ...]       # analyst tags (filterable in the super-timeline)
#   mitre:     ['T1543', ...]       # merged into the event's ATT&CK techniques (forensic timeline)
#   severity:  High                 # raises (never lowers) the event's severity (forensic timeline)
#   view:      'name'               # optional saved-view label reported by a manual run
#
# Operators (exactly one per condition):
#   contains: 'x'  |  ['a','b']     # case-insensitive substring; a list is OR
#   equals:   'x'  |  ['a','b']     # case-insensitive exact match (per array element for list fields)
#   regex:    'pat'   flags: 'i'    # JS regex against the field text
#
# BACKSLASHES: single-quoted YAML does not process escapes, so what you type is what the matcher
# gets. In `contains` write the path exactly — '\system32\config\sam'. Double it ONLY inside
# `regex`, where the REGEX needs the escape — '\\currentversion\\run'. Getting this backwards is
# silent: the condition compiles, matches nothing, and reads as "not present in this case".
#   exists:   true | false          # field present-and-non-empty / absent
#
# Matchable fields are the real ForensicEvent fields — an UNKNOWN field is a load error, never a
# silent no-op:  description, message, asset, path, artifactName, processName, parentName,
# commandLine, sha256, md5, srcIp, dstIp, veloUrl, severity, action, sources, mitreTechniques,
# relatedFindingIds, provenance, port, pid, count.
#
# DESIGN NOTE — this default set is COMPLEMENTARY to the built-in deterministic grader
# (analysis/tradecraftRules.ts), which already scores Defender/AV tampering, BYOVD, UAC bypass,
# mimikatz and log-clearing command lines. To avoid double-grading the same event, the rules below
# target artifact/event-ID/path/filename evidence rather than re-implementing those command-line
# patterns. Edit freely from the dashboard (Tagger → Edit rules) or point TAGGER_RULES_FILE at your
# own file.

# ─────────────────────────── Windows Event Log — persistence / execution ───────────────────────────
win_service_install:
  description: Windows service installed (Security 4697 / System 7045)
  # Hayabusa rows keep their text in `description` and carry no `message`, so both are read. The
  # description side anchors on "(EID nnnn" — a bare '7045' would also hit a PID or a byte count in
  # a detail field — and leaves out 'Service Control Manager', which names every 7036 state change.
  # The message side names the id through its key (`EventID: 7045`, `EID 4697`). A bare '7045' or
  # '4697' also sits inside a SHA256, MD5 or PID, and graded an AVG installer launch as persistence.
  any:
    - { field: message, contains: ['A new service was installed', 'Service Control Manager'] }
    - { field: message, regex: '(?:event_?id|eid)\W{0,4}(?:7045|4697)(?!\d)', flags: 'i' }
    - { field: description, contains: ['(EID 7045', '(EID 4697', 'A new service was installed'] }
  none:
    - { field: message, contains: ['svchost.exe -k'] }   # routine OS service hosting
    - { field: description, contains: ['svchost.exe -k'] }
  tags: ['win-service', 'persistence']
  mitre: ['T1543.003']
  severity: Medium
  view: 'Service installation'

win_scheduled_task:
  description: Scheduled task created / updated (Security 4698/4702, TaskScheduler 106/140)
  # Hayabusa rows carry no `message`; see win_service_install. The description side names 106/140
  # only under a TaskScheduler channel, because a bare 'TaskScheduler' would match every task run.
  # The message side follows the same rule: it names the REGISTER / UPDATE text of events 106 and 140
  # (`registered Task Scheduler task`, `updated Task Scheduler task`), never the channel name, which
  # every task start (100) and completion (200, 201) message also carries.
  # The message side names 4698/4702 through the id key (`EventID: 4698`, `EID 4702`). A bare '4698'
  # also sits inside a GUID or hash, and graded a McAfee msiexec /X uninstall as persistence.
  any:
    - { field: message, contains: ['A scheduled task was created', 'A scheduled task was updated', 'registered Task Scheduler task', 'updated Task Scheduler task'] }
    - { field: message, regex: '(?:event_?id|eid)\W{0,4}(?:4698|4702)(?!\d)', flags: 'i' }
    - { field: description, contains: ['(EID 4698', '(EID 4702', 'A scheduled task was created', 'A scheduled task was updated'] }
    - { field: description, regex: '\(EID (?:106|140) [^)]*TaskSch', flags: 'i' }
  tags: ['win-scheduled-task', 'persistence']
  mitre: ['T1053.005']
  severity: Medium
  view: 'Scheduled tasks'

win_wmi_persistence:
  description: WMI event subscription (permanent consumer) — a classic fileless persistence
  any:
    - { field: message, contains: ['EventConsumer', 'CommandLineEventConsumer', '__EventFilter', 'FilterToConsumerBinding'] }
    - { field: description, contains: ['EventConsumer', 'CommandLineEventConsumer', '__EventFilter', 'FilterToConsumerBinding'] }   # Hayabusa: no `message`
  tags: ['wmi-persistence', 'persistence']
  mitre: ['T1546.003']
  severity: High
  view: 'WMI persistence'

# A Run / RunOnce key being WRITTEN: Sysmon 12/13, Security 4657, a registry-change record. The key
# name may end the line (4657's Object Name, a Sysmon 12 on the key itself), and a record with no
# rendered message carries the key only in its description, so all three fields are read.
# PersistenceSniper rows are excluded (#1666). The module ENUMERATES every autostart that already
# exists, so its Path IS a Run key on every host: on a clean image this rule graded the stock VMware
# Tools, OneDrive and Edge WebView entries Medium. Such a row is known by its artifact name (the test
# the Velociraptor dispatcher uses) or, when the upload carried no artifact name, by the fixed prefix
# persistenceSniperImport.ts writes at the start of its description.
win_run_key:
  description: Registry Run / RunOnce autorun key written
  any:
    - { field: path, regex: '\\currentversion\\run(?:once)?(?:\\|\s|$)', flags: 'i' }
    - { field: message, regex: '\\currentversion\\run(?:once)?(?:\\|\s|$)', flags: 'i' }
    - { field: description, regex: '\\currentversion\\run(?:once)?(?:\\|\s|$)', flags: 'i' }
  none:
    - { field: artifactName, contains: 'persistencesniper' }
    - { field: description, regex: '^Velociraptor(?: \[[^\]]*\])?: Persistence \[' }
  tags: ['autorun', 'persistence']
  mitre: ['T1547.001']
  severity: Medium
  view: 'Autorun keys'

# The same Run / RunOnce key as PersistenceSniper enumerated it: tagged and in the view, no grade.
win_run_key_enumerated:
  description: Registry Run / RunOnce autorun entry present (PersistenceSniper enumeration)
  all:
    - { field: path, regex: '\\currentversion\\run(?:once)?(?:\\|\s|$)', flags: 'i' }
  any:
    - { field: artifactName, contains: 'persistencesniper' }
    - { field: description, regex: '^Velociraptor(?: \[[^\]]*\])?: Persistence \[' }
  tags: ['autorun', 'persistence']
  mitre: ['T1547.001']
  view: 'Autorun keys'

# PersistenceSniper (Windows.Forensics.PersistenceSniper) enumerates every autostart mechanism on the
# box — the large majority signed, first-party, and ordinary — so it grades Info by default and no
# rule here grades it: win_run_key excludes it and win_run_key_enumerated only tags it. Its two
# anomaly signals (a known LOLBin used for persistence; a target with a non-valid Authenticode
# signature) are graded High/Medium directly in analysis/persistenceSniperImport.ts,
# from the module's own structured IsLolbin/Signature columns — not by a tagger rule matching the
# rendered description, which would be re-deriving the verdict from text an adversary partly controls
# (Value/Path, real filesystem/registry content on the target) and would silently miss it once the
# description's 600-char cap truncates a long entry. See that file's comment for the incident this
# replaced: a crafted Value like `evil.exe [lolbin]` previously spoofed a High grade the module never
# gave.

# ─────────────────────────── Credential access / LSASS ───────────────────────────
# DUMP ARTIFACTS ONLY — deliberately not Sysmon 10 ACCESS. The built-in grader already decides an
# EID 10 against lsass.exe, and it decides it correctly because it can see the SOURCE process: it
# holds Defender / core-OS / EDR accessors at Low and grades everything else High. A tagger rule
# cannot see that list, so re-grading access here can only overrule it in one direction — severity
# is raise-only. This rule previously matched the bare strings 'lsass.exe' and 'GrantedAccess',
# which every EID 10 carries, so it pushed every routine Defender scan of LSASS back to High and
# undid that grading. Real dumpers also use routine-looking masks (Defender itself opens LSASS with
# 0x1410), so no mask list separates them either. A dump FILE, by contrast, is unambiguous evidence
# and is exactly the artifact/filename shape this ruleset is meant to add.
win_lsass_access:
  description: LSASS credential-dump artifact (a dump file named or written)
  any:
    - { field: message, contains: ['lsass.dmp', 'lsass.dump', 'lsass_dump'] }
    - { field: description, contains: ['lsass.dmp', 'lsass.dump', 'lsass_dump'] }
    - { field: path, contains: ['lsass.dmp', 'lsass.dump'] }
  tags: ['lsass', 'credential-access']
  mitre: ['T1003.001']
  severity: High
  view: 'LSASS dump artifacts'

win_ntds_shadow:
  description: NTDS.dit / SAM / SYSTEM hive theft or shadow-copy staging
  # NOT bare 'HarddiskVolumeShadowCopy': every backup product and every VSS writer logs that string
  # on an ordinary snapshot, so it graded routine backups as credential-store theft. A shadow copy
  # used to STEAL the hive still matches, because the path it reads names ntds.dit or config\sam.
  any:
    - { field: message, contains: ['ntds.dit', 'ntdsutil', '\system32\config\sam'] }
    - { field: description, contains: ['ntds.dit', 'ntdsutil', '\system32\config\sam'] }
    - { field: path, contains: ['ntds.dit'] }
  tags: ['ntds', 'credential-access']
  mitre: ['T1003.003']
  severity: High
  view: 'Credential store theft'

# ─────────────────────────── Lateral movement / remote access ───────────────────────────
win_remote_logon:
  description: Remote interactive / network logon (Security 4624 type 3/10)
  # Anchored on the DESCRIPTION, which the Windows mapper always renders. The rendered event message
  # does not contain the string "4624" at all (the id lives in the System block, not the prose), and
  # the tab literals this rule used to match on were never tabs — YAML single quotes do not process
  # \t — so both halves of the old condition were unmatchable and the rule never fired once.
  all:
    - { field: description, contains: ['(EID 4624)'] }
    - { field: description, regex: 'LogonType=(?:3|10)\b', flags: 'i' }
  tags: ['remote-logon']
  severity: Low
  view: 'Remote logons'

# A network logon alone is routine (shares, printers, service and machine accounts). It becomes a
# lateral-movement lead in two cases. RDP (type 10) from a non-loopback address. Or a network logon
# (type 3) by a named account, not ANONYMOUS LOGON and not a machine account (`NAME$`), that shows a
# source: a non-loopback IpAddress, or a WorkstationName when no address was logged.
win_lateral_logon:
  description: Remote logon from another host (RDP, or network logon by a named user account)
  all:
    - { field: description, contains: ['(EID 4624)'] }
  any:
    - { field: description, regex: 'LogonType=10\b - IpAddress=(?!-|::1|127\.)\S', flags: 'i' }
    - { field: description, regex: '\(EID 4624\) - (?!NT AUTHORITY\\)(?:[^\s$\\]+\\)?[^$\\,]+? - LogonType=3\b(?: - IpAddress=(?!-|::1|127\.)\S| - WorkstationName=\S)', flags: 'i' }
  tags: ['remote-logon', 'lateral-movement']
  mitre: ['T1021']
  severity: Low
  view: 'Remote logons'

win_rdp:
  description: RDP session activity (TerminalServices, port 3389)
  any:
    - { field: message, contains: ['TerminalServices', 'RemoteConnectionManager', 'RDP-Tcp'] }
    - { field: port, equals: '3389' }
  tags: ['rdp', 'lateral-movement']
  mitre: ['T1021.001']
  severity: Low
  view: 'RDP activity'

win_smb_admin_share:
  description: Admin share / PsExec-style service execution (ADMIN$, PSEXESVC)
  any:
    - { field: message, contains: ['ADMIN$', 'PSEXESVC', '\\*\C$', 'psexec'] }
    - { field: description, contains: ['ADMIN$', 'PSEXESVC', '\\*\C$', 'psexec'] }
    - { field: processName, contains: ['psexec', 'psexesvc'] }
  tags: ['smb-admin-share', 'lateral-movement']
  mitre: ['T1021.002', 'T1570']
  severity: Medium
  view: 'Admin-share execution'

# ─────────────────────────── Execution — script hosts ───────────────────────────
win_powershell_encoded:
  description: PowerShell with an encoded command (base64) — obfuscated execution
  any:
    - { field: message, regex: '(?:powershell|pwsh)[^\n]*?[ \t]-e(?:nc|ncodedcommand)?[ \t]+[a-z0-9+/=]{16,}', flags: 'i' }
    - { field: description, regex: '(?:powershell|pwsh)[^\n]*?[ \t]-e(?:nc|ncodedcommand)?[ \t]+[a-z0-9+/=]{16,}', flags: 'i' }
  tags: ['powershell-encoded', 'execution', 'defense-evasion']
  mitre: ['T1059.001', 'T1027']
  severity: Medium
  view: 'Encoded PowerShell'

win_suspicious_child:
  description: Office / script host spawning a shell (macro or exploit execution chain)
  all:
    - { field: parentName, regex: '(winword|excel|powerpnt|outlook|mshta|wscript|cscript)\.exe', flags: 'i' }
    - { field: processName, regex: '(cmd|powershell|pwsh|rundll32|regsvr32)\.exe', flags: 'i' }
  tags: ['suspicious-child-process', 'execution']
  mitre: ['T1059', 'T1566.001']
  severity: High
  view: 'Office-spawned shells'

# A web-server worker spawning a command shell or a discovery binary is the textbook web-application
# exploitation / webshell signal (#1501). Graded High with T1190 HERE, before the AI reads the row,
# because at Medium the seven such rows of a Confluence case were not anchors, earned no backfill
# finding, and the synthesis wrote "no initial-access vector" with the chain in plain sight.
# Windows-only on purpose (`.exe` on both names): on Linux, httpd or php-fpm spawning `sh`/perl is
# ordinary CGI. java/node parents are NOT listed — Jenkins, Bamboo and npm spawn shells by design,
# and a product name in the rendered description does not prove which binary was the parent.
web_server_shell_child:
  description: Web-server worker (Tomcat, IIS, Apache, nginx, PHP) spawning a shell or a discovery command
  all:
    - { field: parentName, regex: '^(?:tomcat\d*|w3wp|httpd|apache\d*|nginx|php-cgi|caddy)\.exe$', flags: 'i' }
    - { field: processName, regex: '^(?:cmd|powershell|pwsh|wscript|cscript|mshta|certutil|bitsadmin|rundll32|regsvr32|whoami|net1?|ipconfig|tasklist|hostname|systeminfo|nltest|quser|query)\.exe$', flags: 'i' }
  tags: ['web-server-shell', 'initial-access']
  mitre: ['T1190', 'T1059']
  severity: High
  view: 'Web-server spawned shells'

# The renamed shape of the same chain: the IMAGE carries the web server's name and takes a command
# shell's `/c` or `/k` switch. No Tomcat, IIS or Apache worker takes one; a cmd.exe renamed to
# tomcat9.exe does. Keyed on the structured command line (not the rendered description) so a change
# in how `CommandLine=` is rendered cannot silently retire the rule. The switch must sit where cmd.exe
# reads it — right after the image, behind at most cmd's own modifiers (/d /a /u /q /s /t:xx /e:on
# /f:off /v:on) — not anywhere in the arguments: `httpd.exe -c "Redirect /c /new"` is an Apache
# directive, not a shell. An image path with spaces is expected quoted, as Sysmon records it.
web_server_named_shell:
  description: A web-server-named image running with a command-shell switch (renamed cmd.exe masquerading as the web server)
  all:
    - { field: processName, regex: '^(?:tomcat\d*|w3wp|httpd|apache\d*|nginx|php-cgi|caddy)\.exe$', flags: 'i' }
    - { field: commandLine, regex: '^(?:"[^"]*"|[^\s"]+)(?: /(?:[adqsu]|[efv]:o(?:n|ff)|t:[0-9a-f]{2}))* /[ck]\s', flags: 'i' }
  tags: ['web-server-shell', 'initial-access', 'masquerading']
  mitre: ['T1190', 'T1036.003', 'T1059']
  severity: High
  view: 'Web-server spawned shells'

# A server-side script CREATED under a web root is how a webshell lands. The rules above grade the
# server SPAWNING a shell; nothing graded the write itself, so a shell dropped and not yet used — or
# used through a channel that left no process row — never reached the AI. Web roots: IIS
# (inetpub, wwwroot), Tomcat (webapps), Apache (htdocs), and Exchange's OWA/ECP folders, where the
# ProxyLogon/ProxyShell shells were written. Only a CREATE is graded — a Sysmon 11 row or a USN
# FileCreate — never an MFT listing or an overwrite: a site holds thousands of pages and a deploy
# rewrites them, so presence and modification say nothing on their own.
#
# High ONLY when the IIS worker (w3wp.exe) ITSELF wrote an ASP.NET page into a web root: an ASP.NET
# site does not write its own .aspx/.ashx/.asmx at run time, so that write is the upload shape
# (aspnet_client, Exchange OWA/ECP). Other servers are left to the Medium rule below ON PURPOSE:
# Tomcat explodes every deployed .war into .jsp files from tomcat9.exe, and a PHP CMS updates its
# own .php files through php-cgi/httpd — High there would flood the record with routine deploys.
# The writer is read from the Sysmon 11 description (`Image=` precedes `TargetFilename=`).
web_server_script_write:
  description: IIS worker (w3wp.exe) writing an ASP.NET page under a web root (webshell upload)
  all:
    - { field: path, regex: '(?:[\\/](?:inetpub|wwwroot)[\\/]|[\\/]httpproxy[\\/](?:owa|ecp)[\\/]|[\\/]clientaccess[\\/]ecp[\\/])[^\n]*\.(?:aspx?|ashx|asmx)$', flags: 'i' }
    - { field: description, regex: '\(EID 11\) - Image=[^\n]*?[\\/]w3wp\.exe - TargetFilename=', flags: 'i' }
  none:
    - { field: path, regex: '[\\/]inetpub[\\/]temp[\\/]', flags: 'i' }
  tags: ['webshell-write', 'persistence']
  mitre: ['T1505.003']
  severity: High
  view: 'Webshell writes'

# Any other create of a server-side script under a web root — a USN FileCreate names no writer, and
# a person, a deploy tool, a .war deploy or a CMS update writes pages too. Medium: in the forensic
# timeline as a lead, not an anchor; a deploy burst is dismissed once through the FP workflow. IIS's
# own scratch folder (inetpub\temp — app-pool configs, compression cache) is excluded.
web_root_script_created:
  description: Server-side script created under a web root (possible webshell drop)
  all:
    - { field: path, regex: '(?:[\\/](?:inetpub|wwwroot|webapps|htdocs)[\\/]|[\\/]httpproxy[\\/](?:owa|ecp)[\\/]|[\\/]clientaccess[\\/]ecp[\\/])[^\n]*\.(?:aspx?|ashx|asmx|cshtml|jspx?|php\d?|phtml)$', flags: 'i' }
  any:
    - { field: description, regex: '\(EID 11\) - Image=', flags: 'i' }
    - { field: description, regex: '^UsnJrnl: [^\n]*\b(?:FileCreate|FILE_CREATE)\b', flags: 'i' }
  none:
    - { field: path, regex: '[\\/]inetpub[\\/]temp[\\/]', flags: 'i' }
  tags: ['webshell-write', 'persistence']
  mitre: ['T1505.003']
  severity: Medium
  view: 'Webshell writes'

# Web vulnerability scanners (#1964). Offensive tooling, not routine admin enumeration, so Medium —
# unlike the tag-only host discovery in reconTechniques.ts. The tool must be an argv token (after
# start, whitespace, a quote or a path separator) FOLLOWED by an argument (-flag, an IP or a URL),
# so `cd /opt/sqlmap`, `vim vulmap.py` and `git clone …/sqlmap` do not match. `xray` is a common
# word and a radiology product name, so it matches only with a scan subcommand (webscan/ws/
# servicescan/ss), with at most two option pairs before it. Bash rows carry the command only in
# `description`, so that side is anchored on the "Shell command" prefix.
web_scanner_tool:
  description: Web vulnerability scanner run (sqlmap, dirsearch, xray webscan/servicescan, vulmap, WebLogicScan)
  any:
    - { field: commandLine, regex: '(?:^|[\s"\\/])(?:sqlmap|dirsearch|vulmap|weblogicscan)(?:\.py|\.exe)?"?\s+(?:-|\d|https?:)', flags: 'i' }
    - { field: commandLine, regex: '(?:^|[\s"\\/])xray(?:_[a-z0-9_]+)?(?:\.exe)?"? (?:-{1,2}[a-z-]+[ =][^ ]+ ){0,2}(?:webscan|ws|servicescan|ss)(?= |$)', flags: 'i' }
    - { field: description, regex: '^Shell command[^:]*:[^\n]*?(?:^|[\s"\\/])(?:sqlmap|dirsearch|vulmap|weblogicscan)(?:\.py|\.exe)?"?\s+(?:-|\d|https?:)', flags: 'i' }
    - { field: description, regex: '^Shell command[^:]*:[^\n]*?(?:^|[\s"\\/])xray(?:_[a-z0-9_]+)?(?:\.exe)?"? (?:-{1,2}[a-z-]+[ =][^ ]+ ){0,2}(?:webscan|ws|servicescan|ss)(?= |$)', flags: 'i' }
  none:
    - { field: commandLine, regex: '\b(?:pip[\d.]*|apt(?:-get)?|yum|dnf|brew|choco|winget|git)(?:\.exe)?\s+(?:install|download|clone|show|search)\b', flags: 'i' }
    - { field: description, regex: '\b(?:pip[\d.]*|apt(?:-get)?|yum|dnf|brew|choco|winget|git)(?:\.exe)?\s+(?:install|download|clone|show|search)\b', flags: 'i' }
  tags: ['web-scanner', 'reconnaissance']
  mitre: ['T1595.002']
  severity: Medium
  view: 'Web scanners'

web_scanner_exploit_mode:
  description: Web scanner run in an exploit mode (sqlmap --os-shell / --os-pwn / --file-write, vulmap -m exp)
  any:
    - { field: commandLine, regex: '(?:^|[\s"\\/])(?:sqlmap|dirsearch|vulmap|weblogicscan)(?:\.py|\.exe)?"?\s+(?:-|\d|https?:)[^\n]*?\s(?:--os-(?:shell|pwn|cmd|smbrelay|bof)|--file-write|--sql-shell|-m\s+exp|--mode[\s=]exp)(?=[\s=]|$)', flags: 'i' }
    - { field: description, regex: '^Shell command[^:]*:[^\n]*?(?:^|[\s"\\/])(?:sqlmap|dirsearch|vulmap|weblogicscan)(?:\.py|\.exe)?"?\s+(?:-|\d|https?:)[^\n]*?\s(?:--os-(?:shell|pwn|cmd|smbrelay|bof)|--file-write|--sql-shell|-m\s+exp|--mode[\s=]exp)(?=[\s=]|$)', flags: 'i' }
  tags: ['web-scanner', 'exploitation']
  mitre: ['T1595.002', 'T1190']
  severity: High
  view: 'Web scanners'

# The ClickFix paste (#1947): a lure tells the user to paste a PowerShell line into Run, and the line
# fetches from a bare-number host (a decimal-encoded IPv4 such as http://3232235777/) or a raw IPv4
# and writes the payload to a temp script, or hands it straight to iex. At Medium the paste was read
# as noise and the case reported the entry vector as unknown. Three parts must all be present: a
# fetch verb, a numeric host (a dotted quad followed by `.example.com` is a hostname, not an IP), and
# a temp-script or iex sink. Named hosts are left out on purpose — vendor installers fetch into TEMP
# every day. High, not Critical: admin scripts also fetch from raw IPs, so this is a "download
# cradle" lead, not proof. An `echo` of the string with no sink (a lab stand-in) does not match.
# No TRADECRAFT_RULES entry grades this shape, so it is not double-graded. Reads commandLine
# (Sysmon/EDR), description (Hayabusa, console history) and message (script-block rows).
win_clickfix_download_cradle:
  description: PowerShell download cradle from a bare-number or raw-IP host into a temp script or iex (ClickFix paste)
  any:
    - { field: commandLine, regex: '^(?=[^\n]*\b(?:iwr|irm|invoke-webrequest|invoke-restmethod|curl(?:\.exe)?|wget|downloadstring|downloadfile|start-bitstransfer)\b)(?=[^\n]*\bhttps?://(?:\d{8,10}|\d{1,3}(?:\.\d{1,3}){3})(?=[:/"''\s)]|$))(?=[^\n]*(?:(?:\\temp\\|\$env:temp|%temp%)[^\s"'';|]*\.(?:ps1|bat|cmd|vbs|js|hta)\b|\b(?:iex|invoke-expression)\b))', flags: 'i' }
    - { field: description, regex: '^(?=[^\n]*\b(?:iwr|irm|invoke-webrequest|invoke-restmethod|curl(?:\.exe)?|wget|downloadstring|downloadfile|start-bitstransfer)\b)(?=[^\n]*\bhttps?://(?:\d{8,10}|\d{1,3}(?:\.\d{1,3}){3})(?=[:/"''\s)]|$))(?=[^\n]*(?:(?:\\temp\\|\$env:temp|%temp%)[^\s"'';|]*\.(?:ps1|bat|cmd|vbs|js|hta)\b|\b(?:iex|invoke-expression)\b))', flags: 'i' }
    - { field: message, regex: '^(?=[^\n]*\b(?:iwr|irm|invoke-webrequest|invoke-restmethod|curl(?:\.exe)?|wget|downloadstring|downloadfile|start-bitstransfer)\b)(?=[^\n]*\bhttps?://(?:\d{8,10}|\d{1,3}(?:\.\d{1,3}){3})(?=[:/"''\s)]|$))(?=[^\n]*(?:(?:\\temp\\|\$env:temp|%temp%)[^\s"'';|]*\.(?:ps1|bat|cmd|vbs|js|hta)\b|\b(?:iex|invoke-expression)\b))', flags: 'i' }
  tags: ['download-cradle', 'initial-access']
  mitre: ['T1105', 'T1059.001', 'T1204.004']
  severity: High
  view: 'Download cradles'

# ─────────────────────────── Impact — ransomware precursors ───────────────────────────
win_shadow_copy_delete:
  description: Volume shadow copy / backup deletion (recovery inhibition)
  # NOT bare 'bcdedit': `bcdedit /enum` is a routine admin query and graded High. The two bcdedit
  # forms that actually inhibit recovery are named in full instead.
  any:
    - { field: message, contains: ['vssadmin delete shadows', 'wmic shadowcopy delete', 'wbadmin delete', 'Delete Catalog', 'recoveryenabled no', 'bootstatuspolicy ignoreallfailures'] }
    - { field: description, contains: ['vssadmin delete shadows', 'wmic shadowcopy delete', 'wbadmin delete', 'Delete Catalog', 'recoveryenabled no', 'bootstatuspolicy ignoreallfailures'] }
  tags: ['shadow-copy-delete', 'impact']
  mitre: ['T1490']
  severity: High
  view: 'Recovery inhibition'

# ─────────────────────────── Malware staging locations ───────────────────────────
staging_temp_executable:
  description: Executable written to a world-writable / temp staging path
  any:
    - { field: path, regex: '\\(?:temp|tmp|appdata\\local\\temp|programdata|public|windows\\temp)\\[^\\]*\.(?:exe|dll|scr|ps1|bat|hta|js|vbs)$', flags: 'i' }
  tags: ['temp-staging']
  severity: Medium
  view: 'Temp-path executables'

# A bulk-transfer tool listed in Amcache (#1970). Both importers grade Amcache rows Info, so an
# rclone run seen only there was demoted and never reached the AI. Prefetch already grades these
# names Medium (prefetchExecution.ts DUAL_USE, T1567.002); this is the same grade for the Amcache
# row. The description anchor limits it to Amcache: `Amcache: ` is the EZ Tools CSV row, `Program file
# present (Amcache)` the Velociraptor row. An MFT or USN row for the same file is left alone — a
# tool on disk without its config is graded by analysis/transferToolStaging.ts, not here. Keep the
# name list in step with DUAL_USE (tests/analysis/tagsYamlTransferTool.test.ts pins it).
amcache_transfer_tool:
  description: Bulk-transfer / cloud-sync tool listed in Amcache (rclone, restic, MEGAsync, MEGAcmd)
  all:
    - { field: path, regex: '(?:^|[\\/])(?:rclone|restic|megasync|megacmd)\.exe$', flags: 'i' }
  any:
    - { field: description, regex: '^Amcache: ', flags: 'i' }
    - { field: description, regex: '^Velociraptor(?: \[[^\]]*\])?: Program file present \(Amcache\)', flags: 'i' }
  tags: ['transfer-tool', 'exfiltration']
  mitre: ['T1567.002']
  severity: Medium
  view: 'Transfer tools'

# A remote-access (RMM) tool listed in Amcache. Both importers grade Amcache rows Info, and the
# command-line grader (tradecraftRules.ts) never sees a row with no command line, so an AnyDesk or
# ScreenConnect install seen only here never reached the AI. Medium with T1219 — the grade Prefetch
# gives the same names (attackToolNames.ts REMOTE_ACCESS_TOOLS): a lead, because admins install
# these too. Anchored on the Amcache description like amcache_transfer_tool, so an MFT listing of
# the same file stays Info. Keep the name list in step with REMOTE_ACCESS_TOOLS
# (tests/analysis/remoteAccessTools.test.ts pins it).
amcache_remote_access_tool:
  description: Remote-access / RMM tool listed in Amcache (AnyDesk, ScreenConnect, TeamViewer, Atera, …)
  all:
    - { field: path, regex: '(?:^|[\\/])(?:anydesk|rustdesk|teamviewer|teamviewer_service|logmein|lmiguardiansvc|ateraagent|meshagent|tacticalrmm|dwagent|rutserv|rfusclient|supremo|screenconnect\.clientservice|screenconnect\.windowsclient)\.exe$', flags: 'i' }
  any:
    - { field: description, regex: '^Amcache: ', flags: 'i' }
    - { field: description, regex: '^Velociraptor(?: \[[^\]]*\])?: Program file present \(Amcache\)', flags: 'i' }
  tags: ['remote-access-tool', 'command-and-control']
  mitre: ['T1219']
  severity: Medium
  view: 'Remote-access tools'

# The CLR writes `<host>.exe.log` under UsageLogs the first time a process loads .NET. These hosts
# never load .NET on their own, so a usage log named after one is the disk trace of Cobalt Strike
# execute-assembly — in scenario 019 the ONLY trace of Seatbelt/SharpShares (#1559). dotnet.exe and
# powershell.exe are not listed: they load the CLR by design. The AI reads what the file means from
# a derived note (analysis/clrUsageLogNote.ts) keyed on this rule's id — keep the id and the path
# regex there in step with this one.
clr_usagelog_lolbin_host:
  description: CLR usage log named after a LOLBin (.NET assembly loaded into a sacrificial process — execute-assembly)
  any:
    - { field: path, regex: '\\microsoft\\clr_v[24]\.0(?:_32)?\\usagelogs\\(?:rundll32|regsvr32|mshta|wmic|msxsl|dllhost|werfault|svchost|notepad)\.exe\.log$', flags: 'i' }
  tags: ['execute-assembly']
  mitre: ['T1620', 'T1218.011']
  severity: High
  view: 'Execute-assembly traces'

# ─────────────────────────── Removable media ───────────────────────────
# A mass-storage mount arrives ungraded, and Info never reaches the forensic timeline — so without
# this rule the AI cannot reason about a USB device at all, whichever bundle collected it. Low, not
# higher: attaching a USB stick is ordinary, and only the surrounding activity makes it exfil.
removable_media_mount:
  description: Removable mass-storage device mounted (USB device history)
  any:
    - { field: artifactName, contains: ['Mounted.Mass.Storage', 'USB', 'RemovableMedia'] }
    - { field: message, contains: ['USBSTOR', 'MountedDevices', 'MountPoints2', 'setupapi.dev.log'] }
    - { field: path, contains: ['\Enum\USBSTOR\', '\MountPoints2\'] }
  tags: ['removable-media', 'usb']
  mitre: ['T1091', 'T1052.001']
  severity: Low
  view: 'Removable media'

# ─────────────────────────── Privilege escalation — token manipulation / coercion ───────────────────────────
# The command-line grader (analysis/tradecraftRules.ts) covers these patterns when they arrive as a
# process command line or a 4104 script block. These rules cover the OTHER shapes the same tradecraft
# arrives in — a DetectRaptor/Sigma verdict whose rendered text names the framework, a tool sitting on
# disk found by a file scan, an execution artifact naming the binary — which carry no command line at
# all and would otherwise reach the timeline ungraded.
privesc_token_manipulation:
  description: Access-token privilege manipulation (WinPwn AdjPriv / AdjustTokenPrivileges compiled in memory)
  # Anchored on the API and framework NAMES, never on the privilege names alone: Security 4672
  # ("Special privileges assigned to new logon") lists SeDebugPrivilege and SeImpersonatePrivilege on
  # every administrator logon, so a bare privilege-name match would grade routine admin sign-ins High.
  any:
    - { field: message, regex: 'add-type[^\n]{0,200}(?:adjpriv|adjusttokenprivileges|token_adjust_privileges)', flags: 'i' }
    - { field: description, regex: 'add-type[^\n]{0,200}(?:adjpriv|adjusttokenprivileges|token_adjust_privileges)', flags: 'i' }
    - { field: message, contains: ['AdjustTokenPrivileges', 'WinPwn'] }
    - { field: description, contains: ['AdjustTokenPrivileges', 'WinPwn'] }
  tags: ['token-manipulation', 'privilege-escalation']
  mitre: ['T1134.001', 'T1059.001']
  severity: High
  view: 'Token manipulation'

privesc_coercion_tooling:
  description: Local privilege-escalation tooling (RogueWinRM / Potato family / PrintSpoofer) present or executed
  # RogueWinRM binds the WinRM port (5985) and coerces the BITS service into authenticating to it,
  # elevating a service account to SYSTEM; the Potato family and PrintSpoofer coerce DCOM and the
  # print spooler the same way. Named tools with no legitimate use, so the name alone is the finding.
  any:
    - { field: path, regex: '(?:roguewinrm|rogue_winrm|juicypotato|sweetpotato|godpotato|badpotato|rottenpotato|hotpotato|localpotato|efspotato|printspoofer)', flags: 'i' }
    - { field: processName, regex: '(?:roguewinrm|rogue_winrm|juicypotato|sweetpotato|godpotato|badpotato|rottenpotato|hotpotato|localpotato|efspotato|printspoofer)', flags: 'i' }
    - { field: message, regex: '(?:roguewinrm|rogue_winrm|juicypotato|sweetpotato|godpotato|badpotato|rottenpotato|hotpotato|localpotato|efspotato|printspoofer)', flags: 'i' }
    - { field: description, regex: '(?:roguewinrm|rogue_winrm|juicypotato|sweetpotato|godpotato|badpotato|rottenpotato|hotpotato|localpotato|efspotato|printspoofer)', flags: 'i' }
  tags: ['privilege-escalation', 'offensive-tool']
  mitre: ['T1068', 'T1134.002']
  severity: High
  view: 'Privilege escalation tooling'

# ─────────────────────────── Adversary-emulation framework agents ───────────────────────────
# A MITRE Caldera sandcat agent: the binary itself (often renamed, e.g. splunkd.exe in C:\Users\Public),
# its launch arguments (-server <url> -group <name>), and the stager that fetches it from /file/download
# with a platform/file header. A FACT for synthesis, not a verdict: no severity (a real attacker can run
# Caldera too), so every row keeps its import grade. It reads file/process names and launch arguments
# only — never description or message — so a script comment or a write-up that NAMES sandcat does not
# fire (the #747 hazard). analysis/emulationAgentContext.ts mirrors these patterns for the synthesis
# context line; keep the two in step — a drift test runs both over one fixture set (#1957).
emulation_framework_agent:
  description: Adversary-emulation framework agent (MITRE Caldera sandcat) — file, process or launch arguments
  any:
    - { field: path, regex: '(?:^|[\\/])sandcat(?:\.[^\\/]{1,40})?$', flags: 'i' }
    - { field: processName, regex: '(?:^|[\\/])sandcat(?:\.[^\\/]{1,40})?$', flags: 'i' }
    - { field: commandLine, regex: '(?:^|[\s"''])-server [^\n]{1,200}\s-group [^\s]' }
    - { field: commandLine, regex: '/file/download[^\n]{0,300}\b(?:platform|file)[\\"'']{0,2}\s*[:=,]', flags: 'i' }
    - { field: commandLine, regex: '\b(?:platform|file)[\\"'']{0,2}\s*[:=,][^\n]{0,300}/file/download', flags: 'i' }
  tags: ['emulation-framework-agent']
  view: 'Emulation framework agents'
