# The AICodingAgents preservation globs, pinned (#2690).
#
# Converted from the KapeFiles `Targets/Compound/AICodingAgents.tkape` compound target and the nine
# app targets it names (ClaudeCode, OpenAICodex, GitHubCopilot, GeminiCLI, OpenCode, Cursor, Cline,
# RooCode, VisualStudioCode). KapeFiles is MIT-licensed (see NOTICE). Velociraptor's
# `Windows.Triage.Targets` is generated from the same KapeFiles targets, so the AI Agent Forensics
# agent-home YARA scope scans the files that preservation keeps.
#
# Conversion: `%user%` -> `*`, `Recursive: true` -> `/**/`, FileMask appended (default `*`),
# backslashes written as `/` (Velociraptor's glob() accepts both on Windows).
#
# KapeFiles upstream commit: fee80dafa89d80818084337f70e03ad983772cf1 (2026-11-14)
# AICodingAgents.tkape last changed in: d544862a7a64dcb27ecbf55e6526606dd7fb29fc (2026-09-02)
# The weekly upstream rules check compares these lines and opens an issue when either moves.
