<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFIR Companion Data Flow</title>
<meta name="description" content="Interactive map of how evidence moves through DFIR Companion, from every import to every output.">
<style>
:root{
  --bg:#E8ECF0; --grid:#C9D2DB; --band:rgba(255,255,255,.38);
  --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#141D26; --muted:#56636F; --line:#B9C4CF;
  --source:#4B5D70; --process:#0B7A84; --gate:#C98A06; --store:#2C59A3; --ai:#7448D0; --external:#7F8790; --output:#28804F;
  --forbid:#C4352A; --tape-a:#F2B807; --tape-b:#1B1B1B;
  --shadow:0 1px 0 rgba(20,29,38,.06), 0 4px 14px rgba(20,29,38,.08);
  --focus:#0B7A84;
  --f-display:"Bahnschrift","DIN Alternate","DIN Condensed","Barlow Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,"Liberation Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1318; --grid:#1E2A34; --band:rgba(255,255,255,.025);
    --surface:#151E26; --surface-2:#1B2630; --ink:#E3E9EF; --muted:#90A0AE; --line:#2E3C49;
    --source:#8DA2B8; --process:#2EC4CF; --gate:#F2B807; --store:#6E9CF0; --ai:#A989F5; --external:#8E98A2; --output:#4FC984;
    --forbid:#F0604F; --tape-b:#0A0A0A;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --focus:#2EC4CF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1318; --grid:#1E2A34; --band:rgba(255,255,255,.025);
  --surface:#151E26; --surface-2:#1B2630; --ink:#E3E9EF; --muted:#90A0AE; --line:#2E3C49;
  --source:#8DA2B8; --process:#2EC4CF; --gate:#F2B807; --store:#6E9CF0; --ai:#A989F5; --external:#8E98A2; --output:#4FC984;
  --forbid:#F0604F; --tape-b:#0A0A0A;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --focus:#2EC4CF;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font:600 20px/1 var(--f-display);letter-spacing:.02em;margin:0;white-space:nowrap}
.brand h1 b{color:var(--gate);font-weight:600}
.brand span{font:11px var(--f-mono);color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:220px;padding:7px 10px 7px 28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13px var(--f-body)}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;min-width:260px;display:none}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:5px;cursor:pointer}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--surface-2)}
.menu-pop small{display:block;color:var(--muted);font-size:12px}

/* ---------- canvas ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.ease{transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.band{position:absolute;top:0;border-radius:14px;background:var(--band)}
.band-head{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none}
.band-head .n{font:600 13px var(--f-mono);color:var(--gate);letter-spacing:.08em}
.band-head .t{font:600 26px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.band-head .s{font-size:12.5px;color:var(--muted)}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

.edge{fill:none;stroke-width:1.6;opacity:.55;transition:opacity .2s,stroke-width .2s}
.edge.flow{stroke:var(--muted)}
.edge.back{stroke:var(--store);stroke-dasharray:5 5}
.edge.bounded{stroke:var(--gate);stroke-dasharray:9 5;stroke-width:2.2}
.edge.ext{stroke:var(--external);stroke-dasharray:2 4}
.edge.ai{stroke:var(--ai)}
.edge.forbidden{stroke:url(#tape);stroke-width:9;opacity:.95}
.edge.on{opacity:1;stroke-width:2.6}
.edge.forbidden.on{stroke-width:11}
.edge.dim{opacity:.07}
.edge.forbidden.dim{opacity:.25}
.blocker{transition:opacity .2s}
.blocker.dim{opacity:.25}
.elabel{font:600 11.5px var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.elabel.on{opacity:1}
.dot{opacity:.9}

.node{position:absolute;width:var(--w);text-align:left;padding:10px 12px 10px 15px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:opacity .2s,transform .2s,box-shadow .2s,border-color .2s}
.node::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--k)}
.node:hover{transform:translateY(-1px)}
.node .lb{display:block;font:600 16px/1.15 var(--f-display);letter-spacing:.01em}
.node .sb{display:block;margin-top:4px;font:11px/1.35 var(--f-mono);color:var(--muted)}
.node .kd{position:absolute;right:9px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--k)}
.node.k-source{--k:var(--source)} .node.k-process{--k:var(--process)} .node.k-gate{--k:var(--gate)}
.node.k-store{--k:var(--store)} .node.k-ai{--k:var(--ai)} .node.k-external{--k:var(--external)} .node.k-output{--k:var(--output)}
.node.k-gate{border-color:color-mix(in srgb,var(--gate) 55%,var(--line))}
.node.k-gate .kd{border-radius:1px;transform:rotate(45deg)}
.node.k-external{border-style:dashed;background:var(--surface-2)}
.node.hero{border:2px solid var(--k);padding:14px 14px 14px 17px;box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 14%,transparent),var(--shadow)}
.node.hero .lb{font-size:21px}
.node.hero .ey{display:block;font:700 10px var(--f-mono);letter-spacing:.14em;color:var(--k);margin-bottom:4px}
.node.dim{opacity:.18}
.node.sel{box-shadow:0 0 0 3px var(--k),var(--shadow)}
.node.hit{box-shadow:0 0 0 2px var(--k),var(--shadow)}
.node.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--k) 60%,transparent),var(--shadow)}100%{box-shadow:0 0 0 16px transparent,var(--shadow)}}

/* ---------- drawer ---------- */
.drawer{position:fixed;z-index:25;right:0;top:0;bottom:0;width:400px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);
  box-shadow:var(--shadow);transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding-top:var(--barh,56px)}
.drawer.open{transform:none}
.drawer-in{overflow:auto;padding:20px 22px 40px}
.drawer .x{position:absolute;z-index:2;right:12px;top:calc(var(--barh,56px) + 10px);border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:6px;border-radius:6px;line-height:0}
.drawer .x svg{width:18px;height:18px;stroke:var(--muted);stroke-width:2}
.eyebrow{display:flex;gap:8px;align-items:center;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;
  background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k)}
.drawer h2{font:600 30px/1.05 var(--f-display);margin:10px 0 4px;letter-spacing:.01em}
.drawer .sub{font:12px var(--f-mono);color:var(--muted);margin-bottom:14px}
.drawer p.plain{font-size:15px;line-height:1.55;margin:0 0 14px}
.drawer h3{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.drawer ul.pts{margin:0;padding-left:18px}
.drawer .pts{margin:0;padding-left:18px}
.drawer .pts li{margin:0 0 7px}
.drawer ol.steps{padding-left:0;list-style:none;counter-reset:st}
.drawer ol.steps li{counter-increment:st;position:relative;padding-left:30px}
.drawer ol.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:color-mix(in srgb,var(--ai) 18%,transparent);color:var(--ai);font:700 11px/20px var(--f-mono);text-align:center}
.pgroup{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:var(--surface)}
.pgroup summary{cursor:pointer;padding:9px 12px;font:600 16px/1.2 var(--f-display);list-style:none;display:flex;justify-content:space-between;align-items:center}
.pgroup summary::-webkit-details-marker{display:none}
.pgroup summary::after{content:"+";font:600 16px var(--f-mono);color:var(--muted);margin-left:8px}
.pgroup[open] summary::after{content:"–"}
.pgroup summary em{font:600 11px var(--f-mono);font-style:normal;color:var(--muted);margin-left:auto}
.pgroup[open] summary{border-bottom:1px solid var(--line)}
.panels{list-style:none;margin:0;padding:4px 12px 6px}
.panels li{padding:8px 0;border-bottom:1px dashed var(--line)}
.panels li:last-child{border-bottom:0}
.panels b{display:block;font-size:14px}
.panels span{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
.panels .links button{font-size:11.5px;padding:2px 7px}
.drawer p.intro{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.links button i{width:7px;height:7px;border-radius:50%;background:var(--k);display:inline-block}
.links button em{font-style:normal;color:var(--muted);font:11px var(--f-mono)}
.links button:hover{border-color:var(--k)}
.tech code{display:block;font:12px/1.5 var(--f-mono);padding:6px 9px;background:var(--surface-2);border-radius:5px;margin-bottom:4px;word-break:break-all;color:var(--ink)}
.rule-card{border:1px solid var(--line);border-left:4px solid var(--gate);border-radius:7px;padding:10px 12px;margin-bottom:10px;cursor:pointer;background:var(--surface)}
.rule-card:hover,.rule-card.on{border-color:var(--gate);background:var(--surface-2)}
.rule-card.red{border-left-color:var(--forbid)}
.rule-card b{display:block;font:600 16px/1.2 var(--f-display);margin-bottom:3px}
.rule-card span{font-size:13px;color:var(--muted)}
body.no-tech .tech-only{display:none}

/* ---------- legend + zoom ---------- */
.legend{position:fixed;left:16px;bottom:16px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px;max-width:min(560px,calc(100% - 32px))}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 14px}
.legend .row + .row{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.legend .it{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent;background:none;border-radius:5px;padding:2px 6px;margin:-2px -6px;cursor:pointer;font-size:12px}
.legend .it:hover{border-color:var(--line);background:var(--surface-2)}
.legend .it[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);font-weight:600}
.legend .lhint{font:11px var(--f-mono);color:var(--muted);margin:-2px 0 6px}
.legend .sw{width:10px;height:10px;border-radius:2px;background:var(--k)}
.legend svg{width:30px;height:10px}
.legend .hide{position:absolute;right:6px;top:4px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.legend.min .row{display:none}
.legend.min{padding:6px 30px 6px 12px}
.legend .ttl{display:none;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.legend.min .ttl{display:block}
.zoom{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:4px}
.zoom .btn{justify-content:center;width:36px;height:36px;padding:0}
body.drawer-open .zoom{right:416px}

/* ---------- tour ---------- */
.tour{position:fixed;z-index:28;left:50%;bottom:20px;transform:translate(-50%,140%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
  width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tour.open{transform:translate(-50%,0)}
.tour .top{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tour h4{font:600 20px/1.15 var(--f-display);margin:6px 0 4px}
.tour p{margin:0 0 12px;font-size:14px;opacity:.9}
.tour .nav{display:flex;gap:8px;align-items:center}
.tour .nav button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:none;color:var(--bg);border-radius:6px;padding:6px 12px;cursor:pointer}
.tour .nav button.primary{background:var(--gate);border-color:var(--gate);color:#141D26;font-weight:600}
.tour .nav button:disabled{opacity:.35;cursor:default}
.tour .prog{flex:1;height:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;overflow:hidden}
.tour .prog i{display:block;height:100%;background:var(--gate);transition:width .3s}
.tour .close{border:0;background:none;color:var(--bg);cursor:pointer;font-size:18px;opacity:.7}

.hint{position:fixed;left:50%;top:calc(var(--barh,56px) + 12px);transform:translateX(-50%);z-index:19;font:12px var(--f-mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 12px;border-radius:99px;pointer-events:none;transition:opacity .4s;white-space:nowrap}

@media (max-width:760px){
  .brand span{display:none}
  .search input{width:150px}
  .btn .lbl{display:none}
  .drawer{top:auto;height:62vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%);padding-top:0}
  .drawer .x{top:10px}
  body.drawer-open .zoom{right:16px;bottom:calc(62vh + 12px)}
  .legend{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body class="">

<header class="bar" id="bar">
  <div class="brand">
    <h1>DFIR Companion <b>/</b> Data flow</h1>
    <span id="stats"></span>
  </div>
  <div class="tools">
    <label class="search" aria-label="Search the map">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search: tagger, VirusTotal, STIX…  ( / )" autocomplete="off">
    </label>
    <div class="menu">
      <button class="btn" id="tourBtn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg><span class="lbl">Follow the data</span></button>
      <div class="menu-pop" id="tourMenu" role="menu"></div>
    </div>
    <button class="btn" id="rulesBtn"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/></svg><span class="lbl">Rules</span></button>
    <button class="btn" id="techBtn" aria-pressed="true" title="Show source files and routes in the detail panel"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg><span class="lbl">Technical</span></button>
    <button class="btn" id="flowBtn" aria-pressed="true" title="Animate data moving along the connections"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="lbl">Flow</span></button>
    <button class="btn" id="themeBtn" title="Switch light / dark"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
  </div>
</header>

<div id="viewport" aria-label="Data flow map. Drag to pan, scroll to zoom.">
  <div id="world">
    <svg id="edges"></svg>
  </div>
</div>

<div class="hint" id="hint">Click a box to trace where its data comes from and goes · drag to pan · scroll to zoom</div>

<aside class="drawer" id="drawer" aria-live="polite">
  <button class="x" id="drawerX" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="drawer-in" id="drawerIn"></div>
</aside>

<div class="legend" id="legend">
  <button class="hide" id="legendHide" aria-label="Collapse legend">–</button>
  <div class="ttl">Legend</div>
  <div class="lhint row">Click an item to bring only that kind to the front</div>
  <div class="row" id="legendKinds"></div>
  <div class="row">
    <button class="it" data-etype="flow"><svg viewBox="0 0 30 10"><path d="M0 5h30" style="stroke:var(--muted)" stroke-width="2"/></svg>data flow</button>
    <button class="it" data-etype="ai"><svg viewBox="0 0 30 10"><path d="M0 5h30" style="stroke:var(--ai)" stroke-width="2"/></svg>AI call</button>
    <button class="it" data-etype="back"><svg viewBox="0 0 30 10"><path d="M0 5h30" style="stroke:var(--store)" stroke-width="2" stroke-dasharray="5 4"/></svg>writes back</button>
    <button class="it" data-etype="bounded"><svg viewBox="0 0 30 10"><path d="M0 5h30" style="stroke:var(--gate)" stroke-width="2.4" stroke-dasharray="8 4"/></svg>analyst-pressed, bounded</button>
    <button class="it" data-etype="ext"><svg viewBox="0 0 30 10"><path d="M0 5h30" style="stroke:var(--external)" stroke-width="2" stroke-dasharray="2 3"/></svg>external service</button>
    <button class="it" data-etype="forbidden"><svg viewBox="0 0 30 10"><path d="M0 5h30" style="stroke:url(#tape)" stroke-width="8"/></svg>never allowed</button>
  </div>
</div>

<div class="zoom">
  <button class="btn" id="zin" aria-label="Zoom in">+</button>
  <button class="btn" id="zout" aria-label="Zoom out">−</button>
  <button class="btn" id="zfit" aria-label="Fit whole map" title="Fit (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div class="tour" id="tour" role="dialog" aria-label="Guided walkthrough">
  <div class="top"><span id="tourName"></span><button class="close" id="tourClose" aria-label="End walkthrough">×</button></div>
  <h4 id="tourTitle"></h4>
  <p id="tourText"></p>
  <div class="nav">
    <button id="tourPrev">Back</button>
    <div class="prog"><i id="tourProg"></i></div>
    <span id="tourCount" style="font:12px var(--f-mono);opacity:.7"></span>
    <button id="tourNext" class="primary">Next</button>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   DATA — every stage, box and connection in the map.
   src/ = companion/src   public/ = dashboard   ext/ = extension/src
   ===================================================================== */
const STAGES = [
  { t: "Sources",       s: "Where evidence enters" },
  { t: "Intake",        s: "Saved first, then read" },
  { t: "Merge",         s: "One record, correlated" },
  { t: "Grading seam",  s: "Copy, raise, cap, then cut" },
  { t: "Case record",   s: "What the case knows" },
  { t: "Analysis",      s: "AI and deterministic passes" },
  { t: "Output safety", s: "Filtered and escaped" },
  { t: "Outputs",       s: "What leaves the tool" },
];

const KINDS = {
  source:   "Source",

    ["login-graph","Rules-only views may read raw rows","The login graph does — there is no AI in it."],
  ]},
];

/* =====================================================================
   RENDER
   ===================================================================== */
const NODE_W = 228, COL_GAP = 120, PAD_X = 60, PAD_TOP = 130, V_GAP = 16;
const BY_ID = Object.fromEntries(NODES.map(n => [n.id, n]));
const world = document.getElementById("world");
const svg = document.getElementById("edges");
const viewport = document.getElementById("viewport");
const SVGNS = "http://www.w3.org/2000/svg";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

EDGES.forEach(([a,b]) => { if (!BY_ID[a] || !BY_ID[b]) console.error("Edge references unknown node:", a, b); });

const IN = {}, OUT = {};
NODES.forEach(n => { IN[n.id] = []; OUT[n.id] = []; });
const EDGE_OBJS = EDGES.filter(([a,b]) => BY_ID[a] && BY_ID[b]).map(([from,to,type,label], i) => {
  const e = { i, from, to, type, label };
  OUT[from].push(e); IN[to].push(e);
  return e;
});

document.getElementById("stats").textContent =
  `${STAGES.length} stages · ${NODES.length} components · ${EDGE_OBJS.length} connections`;

function el(tag, cls, html) { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* legend kinds */
const legendKinds = document.getElementById("legendKinds");
Object.entries(KINDS).forEach(([k, name]) => {
  const s = el("button", "it"); s.style.setProperty("--k", `var(--${k})`);
  s.dataset.kind = k; s.setAttribute("aria-pressed", "false");
  s.innerHTML = `<i class="sw"></i>${esc(name)}`; legendKinds.appendChild(s);
});

/* nodes */
NODES.forEach(n => {
  const b = el("button", `node k-${n.kind}${n.hero ? " hero" : ""}`);
  b.style.setProperty("--w", NODE_W + "px");
  b.dataset.id = n.id;
  b.setAttribute("aria-label", `${n.label}: ${n.sub}`);
  b.innerHTML = `${n.eyebrow ? `<span class="ey">${esc(n.eyebrow)}</span>` : ""}<span class="kd"></span><span class="lb">${esc(n.label)}</span><span class="sb">${esc(n.sub)}</span>`;
  world.appendChild(b);
  n.el = b;
});

/* layout */
function colX(c) { return PAD_X + c * (NODE_W + COL_GAP); }
let WORLD_W = 0, WORLD_H = 0;
function layout() {
  const cols = STAGES.map((_, c) => NODES.filter(n => n.col === c));
  cols.forEach(list => list.forEach(n => { n.w = NODE_W; n.h = n.el.offsetHeight; }));
  const colH = cols.map(list => list.reduce((s, n) => s + n.h, 0) + V_GAP * (list.length - 1));
  const maxH = Math.max(...colH);
  cols.forEach((list, c) => {
    let y = PAD_TOP + (maxH - colH[c]) / 2;
    const x = colX(c);
    list.forEach(n => { n.x = x; n.y = y; n.el.style.left = x + "px"; n.el.style.top = y + "px"; y += n.h + V_GAP; });
  });
  WORLD_W = colX(STAGES.length - 1) + NODE_W + PAD_X;
  WORLD_H = PAD_TOP + maxH + 80;
  world.style.width = WORLD_W + "px"; world.style.height = WORLD_H + "px";
  svg.setAttribute("width", WORLD_W); svg.setAttribute("height", WORLD_H);

  world.querySelectorAll(".band").forEach(b => b.remove());
  STAGES.forEach((s, c) => {
    const band = el("div", "band");
    const x = colX(c) - 22;
    band.style.left = x + "px"; band.style.width = (NODE_W + 44) + "px"; band.style.height = WORLD_H - 20 + "px"; band.style.top = "10px";
    band.innerHTML = `<div class="band-head"><div class="n">${String(c + 1).padStart(2, "0")}</div><div class="t">${esc(s.t)}</div><div class="s">${esc(s.s)}</div></div>`;
    world.insertBefore(band, svg);
  });
}

/* edges */
function sides(e) {
  const a = BY_ID[e.from], b = BY_ID[e.to];
  if (b.col > a.col) return ["r", "l"];
  if (b.col < a.col) return ["l", "r"];
  return ["r", "r"];
}
function buildEdges() {
  svg.innerHTML = `
  <defs>
    <pattern id="tape" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" style="fill:var(--tape-a)"/><rect width="7" height="14" style="fill:var(--tape-b)"/>
    </pattern>
    ${["flow","back","bounded","ext","ai"].map(t => `<marker id="m-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--${({flow:"muted",back:"store",bounded:"gate",ext:"external",ai:"ai"})[t]})"/></marker>`).join("")}
  </defs>`;
  // distribute anchor slots along each node side, ordered by the other end's y
  const slots = {};
  EDGE_OBJS.forEach(e => {
    const [sa, sb] = sides(e);
    (slots[e.from + sa] ||= []).push({ e, end: "s", oy: BY_ID[e.to].y + BY_ID[e.to].h / 2 });
    (slots[e.to + sb] ||= []).push({ e, end: "t", oy: BY_ID[e.from].y + BY_ID[e.from].h / 2 });
  });
  Object.entries(slots).forEach(([key, list]) => {
    list.sort((p, q) => p.oy - q.oy);
    list.forEach((s, i) => {
      const n = BY_ID[s.e[s.end === "s" ? "from" : "to"]];
      const pad = Math.min(14, n.h * .2);
      const y = n.y + pad + (n.h - 2 * pad) * (i + 1) / (list.length + 1);
      s.e[s.end + "y"] = y;
    });
  });
  const gEdges = document.createElementNS(SVGNS, "g");
  const gLabels = document.createElementNS(SVGNS, "g");
  const gDots = document.createElementNS(SVGNS, "g");
  EDGE_OBJS.forEach(e => {
    const a = BY_ID[e.from], b = BY_ID[e.to];
    const [sa, sb] = sides(e);
    const x1 = sa === "r" ? a.x + a.w : a.x, x2 = sb === "r" ? b.x + b.w : b.x;
    const y1 = e.sy, y2 = e.ty;
    let d;
    if (sa === "r" && sb === "l") { const dx = Math.max(50, (x2 - x1) * .45); d = `M${x1} ${y1}C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`; }
    else if (sa === "l" && sb === "r") { const dx = Math.max(50, (x1 - x2) * .45); d = `M${x1} ${y1}C${x1 - dx} ${y1} ${x2 + dx} ${y2} ${x2} ${y2}`; }
    else { const bulge = 46 + Math.min(60, Math.abs(y2 - y1) * .12); d = `M${x1} ${y1}C${x1 + bulge} ${y1} ${x2 + bulge} ${y2} ${x2} ${y2}`; }
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d);
    p.setAttribute("class", `edge ${e.type}`);
    if (e.type !== "forbidden") p.setAttribute("marker-end", `url(#m-${e.type})`);
    gEdges.appendChild(p);
    e.path = p; e.len = p.getTotalLength();
    if (e.label) {
      const m = p.getPointAtLength(e.len / 2);
      const t = document.createElementNS(SVGNS, "text");
      t.setAttribute("x", m.x); t.setAttribute("y", m.y - 6); t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", "elabel"); t.textContent = e.label;
      gLabels.appendChild(t); e.labelEl = t;
    }
    if (e.type === "forbidden") {
      const m = p.getPointAtLength(e.len * .55);
      const g = document.createElementNS(SVGNS, "g");
      g.setAttribute("class", "blocker");
      g.innerHTML = `<circle cx="${m.x}" cy="${m.y}" r="15" style="fill:var(--surface);stroke:var(--forbid)" stroke-width="3"/>
        <path d="M${m.x - 9} ${m.y + 9}L${m.x + 9} ${m.y - 9}" style="stroke:var(--forbid)" stroke-width="3"/>
`;
      gLabels.appendChild(g); e.blocker = g;
      if (e.labelEl) { e.labelEl.remove(); e.labelEl = null; }
    }
    const dot = document.createElementNS(SVGNS, "circle");
    dot.setAttribute("r", e.type === "forbidden" ? 5 : 3.4);
    dot.setAttribute("class", "dot");
    dot.style.fill = (`var(--${({flow:"process",back:"store",bounded:"gate",ext:"external",ai:"ai",forbidden:"forbid"})[e.type]})`);
    gDots.appendChild(dot);
    e.dot = dot; e.t = Math.random();
  });
  svg.append(gEdges, gDots, gLabels);
}

/* =====================================================================
   VIEW — pan / zoom
   ===================================================================== */
const view = { x: 0, y: 0, k: 1 };
function applyView(ease) {
  world.classList.toggle("ease", !!ease);
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
function availRect() {
  const barH = document.getElementById("bar").offsetHeight;
  const drawerOpen = document.body.classList.contains("drawer-open");
  const mobile = innerWidth <= 760;
  const w = innerWidth - (drawerOpen && !mobile ? 400 : 0);
  const h = innerHeight - barH - (drawerOpen && mobile ? innerHeight * .62 : 0);
  return { x: 0, y: barH, w, h };
}
function fit(ease = true) {
  const r = availRect();
  if (innerWidth <= 760) {            // phone: fit the height, pan sideways through the stages
    view.k = Math.max(.3, Math.min(1, r.h / WORLD_H * .97));
    view.x = 0;
    view.y = r.y + (r.h - WORLD_H * view.k) / 2;
    applyView(ease); return;
  }
  const legendH = legend.classList.contains("min") ? 0 : legend.offsetHeight + 16;
  const h = r.h - legendH;
  const k = Math.min(r.w / WORLD_W, h / WORLD_H) * .97;
  view.k = Math.max(.15, Math.min(1.4, k));
  view.x = r.x + (r.w - WORLD_W * view.k) / 2;
  view.y = r.y + (h - WORLD_H * view.k) / 2;
  applyView(ease);
}
function centerOn(ids, ease = true) {
  const ns = ids.map(id => BY_ID[id]).filter(Boolean);
  if (!ns.length) return;
  const r = availRect();
  const minX = Math.min(...ns.map(n => n.x)), maxX = Math.max(...ns.map(n => n.x + n.w));
  const minY = Math.min(...ns.map(n => n.y)), maxY = Math.max(...ns.map(n => n.y + n.h));
  const k = Math.min(1.1, Math.max(view.k, .55), r.w / (maxX - minX + 240), r.h / (maxY - minY + 200));
  view.k = Math.max(.2, k);
  view.x = r.x + r.w / 2 - ((minX + maxX) / 2) * view.k;
  view.y = r.y + r.h / 2 - ((minY + maxY) / 2) * view.k;
  applyView(ease);
}
function zoomAt(f, cx, cy) {
  const k = Math.max(.15, Math.min(2.5, view.k * f));
  const wx = (cx - view.x) / view.k, wy = (cy - view.y) / view.k;
  view.k = k; view.x = cx - wx * k; view.y = cy - wy * k;
  applyView(false);
}
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) zoomAt(Math.exp(-e.deltaY * .0016), e.clientX, e.clientY);
  else { view.x -= e.deltaX; applyView(false); }
}, { passive: false });

const pointers = new Map();
let drag = null, moved = false, pinch = null;
viewport.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), k: view.k };
    drag = null; return;
  }
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false;
});
addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    zoomAt((pinch.k * d / pinch.d) / view.k, (p.x + q.x) / 2, (p.y + q.y) / 2);
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 4) { moved = true; viewport.classList.add("dragging"); viewport.setPointerCapture?.(e.pointerId); }
  if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(false); }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  viewport.classList.remove("dragging");
  const wasClickOnBg = drag && !moved && !e.target.closest?.(".node");
  drag = null;
  if (wasClickOnBg && e.type === "pointerup") { clearSelection(); }
}
addEventListener("pointerup", endPointer);
addEventListener("pointercancel", endPointer);

/* =====================================================================
   STATE — selection, hover, search, rules, tours
   ===================================================================== */
const S = { sel: null, hover: null, query: "", rule: null, tour: null, step: 0, filter: null };

function lineage(id) {
  const nodes = new Set([id]), edges = new Set();
  const walk = (start, dir) => {
    const stack = [start], seen = new Set([start]);
    while (stack.length) {
      const cur = stack.pop();
      for (const e of (dir === "down" ? OUT[cur] : IN[cur])) {
        if (e.type === "forbidden") continue;
        if (e.type === "back" && cur !== id) continue; // follow write-backs only one hop
        edges.add(e);
        const nxt = dir === "down" ? e.to : e.from;
        nodes.add(nxt);
        if (!seen.has(nxt) && e.type !== "back") { seen.add(nxt); stack.push(nxt); }
      }
    }
  };
  walk(id, "down"); walk(id, "up");
  // always show the forbidden edge touching this node, so the boundary is visible
  [...IN[id], ...OUT[id]].forEach(e => { if (e.type === "forbidden") { edges.add(e); nodes.add(e.from); nodes.add(e.to); } });
  return { nodes, edges };
}
function neighbours(id) {
  const nodes = new Set([id]), edges = new Set();
  [...IN[id], ...OUT[id]].forEach(e => { edges.add(e); nodes.add(e.from); nodes.add(e.to); });
  return { nodes, edges };
}
function matches(q) {
  const s = q.toLowerCase();
  return NODES.filter(n => [n.label, n.sub, n.plain, ...(n.pts || []), ...(n.tech || []), ...(n.id === "dashboard" ? PANEL_GROUPS.flatMap(g => g.panels.flatMap(p => [p[0], p[1]])) : [])].join(" ").toLowerCase().includes(s));
}

function activeSet() {
  if (S.tour) {
    const steps = TOURS[S.tour.i].steps;
    const nodes = new Set(steps.slice(0, S.step + 1).map(s => s[0]));
    const edges = new Set();
    for (let i = 1; i <= S.step; i++) {
      const a = steps[i - 1][0], b = steps[i][0];
      EDGE_OBJS.forEach(e => { if ((e.from === a && e.to === b) || (e.from === b && e.to === a)) edges.add(e); });
    }
    const cur = steps[S.step][0];
    neighbours(cur).edges.forEach(e => { if (nodes.has(e.from) && nodes.has(e.to)) edges.add(e); });
    return { nodes, edges, focus: cur };
  }
  if (S.rule != null) {
    const r = RULES[S.rule];
    const nodes = new Set(r.n), edges = new Set();
    EDGE_OBJS.forEach(e => { if (nodes.has(e.from) && nodes.has(e.to)) edges.add(e); });
    return { nodes, edges };
  }
  if (S.hover && S.hover !== S.sel) return neighbours(S.hover);
  if (S.filter) return legendSet(S.filter);
  if (S.sel) return lineage(S.sel);
  if (S.query) {
    const nodes = new Set(matches(S.query).map(n => n.id));
    return { nodes, edges: new Set(), search: true };
  }
  return null;
}

function render() {
  const a = activeSet();
  NODES.forEach(n => {
    const on = !a || a.nodes.has(n.id);
    n.el.classList.toggle("dim", !on);
    n.el.classList.toggle("sel", n.id === S.sel || (a && a.focus === n.id));
    n.el.classList.toggle("hit", !!(a && a.search && on));
    n.el.classList.toggle("pulse", !!(a && a.focus === n.id));
  });
  EDGE_OBJS.forEach(e => {
    const on = a && a.edges.has(e);
    e.path.classList.toggle("on", !!on);
    e.path.classList.toggle("dim", !!a && !on);
    if (e.labelEl) e.labelEl.classList.toggle("on", !!on);
    if (e.blocker) e.blocker.classList.toggle("dim", !!a && !on);
    e.active = !a || on;
    e.dot.style.display = flowOn && e.active && !(a && a.search) ? "" : "none";
  });
}

/* =====================================================================
   DRAWER
   ===================================================================== */
const drawer = document.getElementById("drawer"), drawerIn = document.getElementById("drawerIn");
function openDrawer(html) {
  drawerIn.innerHTML = html; drawerIn.scrollTop = 0;
  drawer.classList.add("open"); document.body.classList.add("drawer-open");
}
function closeDrawer() { drawer.classList.remove("open"); document.body.classList.remove("drawer-open"); }

function linkList(edges, dirKey) {
  if (!edges.length) return `<p style="color:var(--muted);margin:0">—</p>`;
  return `<div class="links">${edges.map(e => {
    const n = BY_ID[e[dirKey]];
    const note = e.type === "forbidden" ? "never" : e.label;
    return `<button data-go="${n.id}" style="--k:var(--${n.kind})"><i></i>${esc(n.label)}${note ? ` <em>${esc(note)}</em>` : ""}</button>`;
  }).join("")}</div>`;
}
function showNode(id) {
  const n = BY_ID[id];
  const stage = STAGES[n.col];
  const rules = RULES.map((r, i) => ({ r, i })).filter(x => x.r.n.includes(id));
  openDrawer(`
    <div class="eyebrow" style="--k:var(--${n.kind})">${String(n.col + 1).padStart(2, "0")} · ${esc(stage.t)} <span class="chip">${esc(KINDS[n.kind])}</span></div>
    <h2>${esc(n.label)}</h2>
    <div class="sub">${esc(n.sub)}</div>
    <p class="plain">${esc(n.plain)}</p>
    ${n.pts && n.pts.length ? `<ul class="pts">${n.pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    ${(n.sections || []).map(sec => `<h3>${esc(sec.h)}</h3>${sec.intro ? `<p class="intro">${esc(sec.intro)}</p>` : ""}<${sec.ol ? "ol" : "ul"} class="pts${sec.ol ? " steps" : ""}">${sec.items.map(i => `<li>${esc(i)}</li>`).join("")}</${sec.ol ? "ol" : "ul"}>`).join("")}
${id === "dashboard" ? panelGuide() : ""}
    <h3>Data comes from</h3>${linkList(IN[id], "from")}
    <h3>Data goes to</h3>${linkList(OUT[id], "to")}
    ${rules.length ? `<h3>Rules that apply here</h3>${rules.map(x => `<div class="rule-card${x.r.red ? " red" : ""}" data-rule="${x.i}"><b>${esc(x.r.t)}</b><span>${esc(x.r.d)}</span></div>`).join("")}` : ""}
    ${n.tech && n.tech.length ? `<div class="tech-only"><h3>In the code</h3><div class="tech">${n.tech.map(t => `<code>${esc(t)}</code>`).join("")}</div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">src/ = companion/src · ext/ = extension/src</p></div>` : ""}
  `);
}
function panelGuide() {
  const tag = id => { const n = BY_ID[id]; return `<button data-go="${id}" style="--k:var(--${n.kind})"><i></i>${esc(n.label)}</button>`; };
  return `<h3>The ${PANEL_COUNT} panels, by purpose</h3>
    <p class="intro">Each tag shows the box on the map that feeds the panel — click it to jump there.</p>
    ${PANEL_GROUPS.map(g => `<details class="pgroup"><summary>${esc(g.name)} <em>${g.panels.length}</em></summary>
      <ul class="panels">${g.panels.map(([name, desc, src]) => `<li><b>${esc(name)}</b><span>${esc(desc)}</span><div class="links">${src.map(tag).join("")}</div></li>`).join("")}</ul>
    </details>`).join("")}`;
}
function showRules() {
  openDrawer(`
    <div class="eyebrow">Boundaries</div>
    <h2>Rules the flow obeys</h2>
    <p class="plain">These are the lines the code is built not to cross. Click one to light up the part of the map it governs.</p>
    ${RULES.map((r, i) => `<div class="rule-card${r.red ? " red" : ""}${S.rule === i ? " on" : ""}" data-rule="${i}" tabindex="0"><b>${esc(r.t)}</b><span>${esc(r.d)}</span></div>`).join("")}
  `);
}
drawerIn.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { select(go.dataset.go, true); return; }
  const rc = e.target.closest("[data-rule]");
  if (rc) { const i = +rc.dataset.rule; S.rule = S.rule === i ? null : i; S.sel = null; showRules(); render(); if (S.rule != null) centerOn(RULES[i].n); }
});
drawerIn.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-rule]")) e.target.click(); });
document.getElementById("drawerX").addEventListener("click", clearSelection);

/* =====================================================================
   ACTIONS
   ===================================================================== */
function select(id, pan) {
  endTour(true);
  S.sel = id; S.rule = null; S.hover = null; setFilter(null);
  showNode(id); render();
  if (pan) centerOn([...lineage(id).nodes].length > 18 ? [id] : [...neighbours(id).nodes]);
  hideHint();
}
function clearSelection() {
  S.sel = null; S.rule = null; setFilter(null); closeDrawer(); render();
}

/* legend filter: one box kind, or one line style, in the foreground */
function legendSet(f) {
  if (f.kind) {
    const nodes = new Set(NODES.filter(n => n.kind === f.kind).map(n => n.id));
    const edges = new Set(EDGE_OBJS.filter(e => nodes.has(e.from) && nodes.has(e.to)));
    return { nodes, edges };
  }
  const edges = new Set(EDGE_OBJS.filter(e => e.type === f.etype));
  const nodes = new Set([...edges].flatMap(e => [e.from, e.to]));
  return { nodes, edges };
}
function setFilter(f) {
  S.filter = f;
  legend.querySelectorAll(".it").forEach(b => b.setAttribute("aria-pressed",
    !!f && ((f.kind && b.dataset.kind === f.kind) || (f.etype && b.dataset.etype === f.etype))));
}
document.getElementById("legend").addEventListener("click", e => {
  const b = e.target.closest(".it"); if (!b) return;
  const f = b.dataset.kind ? { kind: b.dataset.kind } : { etype: b.dataset.etype };
  const same = S.filter && S.filter.kind === f.kind && S.filter.etype === f.etype;
  endTour(true);
  S.sel = null; S.rule = null; S.query = ""; q.value = ""; closeDrawer();
  setFilter(same ? null : f); render(); hideHint();
});

world.addEventListener("click", e => {
  const b = e.target.closest(".node"); if (!b || moved) return;
  const id = b.dataset.id;
  if (S.sel === id) clearSelection(); else select(id, false);
});
world.addEventListener("pointerover", e => { const b = e.target.closest(".node"); if (b && !S.tour) { S.hover = b.dataset.id; render(); } });
world.addEventListener("pointerout", e => { const b = e.target.closest(".node"); if (b && S.hover) { S.hover = null; render(); } });
world.addEventListener("focusin", e => { const b = e.target.closest(".node"); if (b && !S.tour) { S.hover = b.dataset.id; render(); } });
world.addEventListener("focusout", () => { if (S.hover) { S.hover = null; render(); } });

/* search */
const q = document.getElementById("q");
q.addEventListener("input", () => {
  S.query = q.value.trim(); if (S.query) { S.sel = null; S.rule = null; setFilter(null); closeDrawer(); }
  render();
  const m = S.query ? matches(S.query) : [];
  if (m.length && m.length <= 10) centerOn(m.map(n => n.id));
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const m = matches(q.value.trim()); if (m[0]) { S.query = ""; select(m[0].id, true); } }
  if (e.key === "Escape") { q.value = ""; S.query = ""; render(); q.blur(); }
});

/* toggles */
const techBtn = document.getElementById("techBtn");
techBtn.addEventListener("click", () => {
  const on = techBtn.getAttribute("aria-pressed") !== "true";
  techBtn.setAttribute("aria-pressed", on); document.body.classList.toggle("no-tech", !on);
  try { localStorage.setItem("dfmap-tech", on ? "1" : "0"); } catch (_) {}
});
let flowOn = !reduceMotion;
const flowBtn = document.getElementById("flowBtn");
flowBtn.setAttribute("aria-pressed", flowOn);
flowBtn.addEventListener("click", () => { flowOn = !flowOn; flowBtn.setAttribute("aria-pressed", flowOn); render(); });

document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("dfmap-theme", root.dataset.theme); } catch (_) {}
});
try {
  const t = localStorage.getItem("dfmap-theme"); if (t) document.documentElement.dataset.theme = t;
  if (localStorage.getItem("dfmap-tech") === "0") { techBtn.setAttribute("aria-pressed", "false"); document.body.classList.add("no-tech"); }
} catch (_) {}

document.getElementById("rulesBtn").addEventListener("click", () => {
  endTour(true);
  if (drawer.classList.contains("open") && !S.sel) { S.rule = null; closeDrawer(); render(); return; }
  S.sel = null; setFilter(null); showRules(); render();
});

document.getElementById("zin").addEventListener("click", () => zoomAt(1.25, innerWidth / 2, innerHeight / 2));
document.getElementById("zout").addEventListener("click", () => zoomAt(.8, innerWidth / 2, innerHeight / 2));
document.getElementById("zfit").addEventListener("click", () => fit());

const legend = document.getElementById("legend");
document.getElementById("legendHide").addEventListener("click", e => {
  legend.classList.toggle("min"); e.currentTarget.textContent = legend.classList.contains("min") ? "+" : "–";
});

/* tours */
const tourMenu = document.getElementById("tourMenu"), tourBtn = document.getElementById("tourBtn");
TOURS.forEach((t, i) => {
  const b = el("button", null, `${esc(t.name)}<small>${esc(t.hint)} · ${t.steps.length} steps</small>`);
  b.setAttribute("role", "menuitem");
  b.addEventListener("click", () => { toggleMenu(false); startTour(i); });
  tourMenu.appendChild(b);
});
function toggleMenu(open) { tourMenu.classList.toggle("open", open); tourBtn.setAttribute("aria-expanded", open); }
tourBtn.addEventListener("click", e => { e.stopPropagation(); toggleMenu(!tourMenu.classList.contains("open")); });
document.addEventListener("click", e => { if (!e.target.closest(".menu")) toggleMenu(false); });

const tourEl = document.getElementById("tour");
function startTour(i) {
  S.sel = null; S.rule = null; S.hover = null; S.query = ""; q.value = ""; setFilter(null); closeDrawer();
  S.tour = { i }; S.step = 0; tourEl.classList.add("open"); showStep(); hideHint();
}
function showStep() {
  const t = TOURS[S.tour.i], [id, title, text] = t.steps[S.step];
  document.getElementById("tourName").textContent = t.name;
  document.getElementById("tourTitle").textContent = title;
  document.getElementById("tourText").textContent = text;
  document.getElementById("tourCount").textContent = `${S.step + 1} / ${t.steps.length}`;
  document.getElementById("tourProg").style.width = ((S.step + 1) / t.steps.length * 100) + "%";
  document.getElementById("tourPrev").disabled = S.step === 0;
  document.getElementById("tourNext").textContent = S.step === t.steps.length - 1 ? "Finish" : "Next";
  render();
  const prev = S.step > 0 ? [t.steps[S.step - 1][0]] : [];
  centerOn([id, ...prev]);
}
function endTour(silent) {
  if (!S.tour) return;
  S.tour = null; tourEl.classList.remove("open");
  if (!silent) render();
}
document.getElementById("tourNext").addEventListener("click", () => {
  const t = TOURS[S.tour.i];
  if (S.step < t.steps.length - 1) { S.step++; showStep(); } else { endTour(); fit(); }
});
document.getElementById("tourPrev").addEventListener("click", () => { if (S.step > 0) { S.step--; showStep(); } });
document.getElementById("tourClose").addEventListener("click", () => { endTour(); fit(); });

/* keyboard */
addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); }
  else if (e.key === "Escape") { if (S.tour) { endTour(); fit(); } else { toggleMenu(false); clearSelection(); } }
  else if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey) fit();
  else if (S.tour && e.key === "ArrowRight") document.getElementById("tourNext").click();
  else if (S.tour && e.key === "ArrowLeft") document.getElementById("tourPrev").click();
});

/* hint */
const hint = document.getElementById("hint");
function hideHint() { hint.style.opacity = "0"; }
setTimeout(hideHint, 7000);

/* =====================================================================
   FLOW ANIMATION — evidence packets moving along each connection
   ===================================================================== */
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (flowOn) {
    for (const e of EDGE_OBJS) {
      if (!e.active || e.dot.style.display === "none") continue;
      const speed = e.type === "forbidden" ? 70 : 110;
      e.t = (e.t + dt * speed / e.len) % 1;
      let t = e.t, op = 1;
      if (e.type === "forbidden") {         // the packet reaches the barrier and is stopped
        const stopAt = .55;
        if (t > stopAt) { op = Math.max(0, 1 - (t - stopAt) / .12); t = stopAt; }
      } else {
        op = Math.min(1, t * 8, (1 - t) * 8);
      }
      const p = e.path.getPointAtLength(t * e.len);
      e.dot.setAttribute("cx", p.x); e.dot.setAttribute("cy", p.y);
      e.dot.setAttribute("opacity", op);
    }
  }
  requestAnimationFrame(tick);
}

/* boot */
function boot() {
  document.documentElement.style.setProperty("--barh", document.getElementById("bar").offsetHeight + "px");
  layout(); buildEdges(); render(); fit(false);
}
boot();
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { document.documentElement.style.setProperty("--barh", document.getElementById("bar").offsetHeight + "px"); fit(false); }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); buildEdges(); render(); fit(false); });
requestAnimationFrame(tick);
</script>
</body>
