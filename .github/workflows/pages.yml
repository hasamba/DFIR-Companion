name: Deploy User Manual to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'mkdocs-docs/**'
      - 'mkdocs.yml'
      - 'docs/**'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Fixed minor version: requirements-docs.txt is resolved for it, and a moving '3.x'
          # could pick a Python the pinned wheels do not support.
          python-version: '3.12'

      # Exact == pins for mkdocs-material and its whole dependency tree (#2157): this job runs
      # with pages: write + id-token: write, so an unpinned install would let a hijacked upstream
      # release publish on the docs domain.
      - name: Install MkDocs Material (pinned)
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build

      - name: Assemble final site
        run: |
          # Create the final site: existing landing page at root + manual at /manual/
          mkdir -p _final_site
          cp -r docs/. _final_site/
          mkdir -p _final_site/manual
          cp -r _mkdocs_site/. _final_site/manual/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _final_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
