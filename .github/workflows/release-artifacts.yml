name: Build release artifacts

# On every version tag (vX.Y.Z) build the portable Windows EXE (Node SEA) and both
# extension zips (Chrome/Comet + Firefox), then attach them to a GitHub Release. Runs in parallel
# with docker-publish.yml — the Docker image stays the recommended path for Linux/macOS;
# this workflow produces the "double-click on Windows" download.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach artifacts to (e.g. v0.9.0). Defaults to the workflow ref."
        required: false

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows EXE (Node SEA)
    runs-on: windows-latest
    # ~9 min observed — Windows runners are the slowest and most variable here.
    timeout-minutes: 30
    outputs:
      # SHA256 of the portable zip, consumed by the `chocolatey` job so its package embeds the
      # exact checksum of the same artifact the release publishes.
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci

      # The build still gates: a package built from source that does not compile is worse than no
      # package.
      - name: Build (tsc)
        working-directory: companion
        run: npm run build

      # The suite runs, and its result is visible, but it does NOT gate the EXE.
      #
      # This workflow is tag-only, so before ci.yml grew a windows-test job this was the sole place
      # the suite ever ran on Windows. It rotted across the 423 commits between v0.34.0 and v0.35.0
      # and then failed at the one moment it could do most damage: v0.35.0 and the first v0.35.1
      # both published with NO downloads, because `release` needs this job and the AppImage and
      # extension zips were discarded with it.
      #
      # Producing binaries and policing Windows test health are different jobs. Regressions are
      # caught per-PR by ci.yml's windows-test job, where they can be fixed before a tag exists.
      - name: Tests (non-blocking — see ci.yml windows-test)
        working-directory: companion
        run: npm test
        continue-on-error: true

      - name: Package SEA EXE
        working-directory: companion
        run: npm run package:sea

      - name: Zip dist-sea
        id: zip
        working-directory: companion
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $tag = $tag -replace '/', '-'   # branch refs (workflow_dispatch) contain slashes; tags don't
          $zipName = "dfir-companion-$tag-win-x64.zip"
          Compress-Archive -Path dist-sea\* -DestinationPath $zipName -Force
          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $sha"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: companion/${{ env.ZIP_NAME }}
          if-no-files-found: error

  linux-appimage:
    name: Build Linux AppImage (Node SEA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci

      - name: Type-check + tests
        working-directory: companion
        run: |
          npm run build
          npm test

      - name: Build Linux SEA binary
        working-directory: companion
        run: npm run package:sea

      - name: Build AppImage
        working-directory: companion
        run: npm run package:appimage

      - name: Rename + checksum
        working-directory: companion
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG//\//-}"   # branch refs (workflow_dispatch) contain slashes; tags don't
          OUT="dfir-companion-${TAG}-x86_64.AppImage"
          mv dist-appimage/DFIR-Companion-x86_64.AppImage "dist-appimage/${OUT}"
          sha256sum "dist-appimage/${OUT}"
          echo "APPIMAGE_NAME=${OUT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: companion/dist-appimage/${{ env.APPIMAGE_NAME }}
          if-no-files-found: error

  extension-zip:
    name: Build extension zips
    # Both browser targets in one job: the deps are already installed and the tests already run
    # here, and the Firefox build is the same bundles with a derived manifest (#366). A failure in
    # either zip fails the release, which is the intent — a tag should never publish half the
    # extension.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # SHA256 of the CHROME extension zip, consumed by the `chocolatey` job which bundles it for
      # offline "Load unpacked". Keep this pointing at the Chrome zip: the Chocolatey package
      # downloads and verifies that specific asset. The Firefox zip is logged below but has no
      # consumer, so it deliberately has no job output.
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Tests
        working-directory: extension
        run: npm test

      - name: Build extension (Chrome)
        working-directory: extension
        run: npm run build

      - name: Zip dist (Chrome)
        id: zip
        working-directory: extension
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG//\//-}"   # branch refs (workflow_dispatch) contain slashes; tags don't
          ZIP_NAME="dfir-capture-extension-${TAG}.zip"
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..
          SHA=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          echo "SHA256: ${SHA}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (Chrome)
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension/${{ env.ZIP_NAME }}
          if-no-files-found: error

      # Emits dist-firefox/ — a separate directory, so this cannot disturb the Chrome zip built
      # above. No extra version to bump: the Firefox manifest is derived from manifest.json at
      # build time (#303), so the two targets cannot ship different versions.
      - name: Build extension (Firefox)
        working-directory: extension
        run: npm run build:firefox

      - name: Zip dist-firefox
        working-directory: extension
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG//\//-}"   # branch refs (workflow_dispatch) contain slashes; tags don't
          ZIP_NAME="dfir-capture-extension-firefox-${TAG}.zip"
          # Zipped from INSIDE dist-firefox so manifest.json sits at the archive root, which is
          # what Firefox requires of an add-on archive.
          cd dist-firefox
          zip -r "../${ZIP_NAME}" .
          cd ..
          SHA=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          echo "SHA256: ${SHA}"
          echo "FIREFOX_ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact (Firefox)
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-zip
          path: extension/${{ env.FIREFOX_ZIP_NAME }}
          if-no-files-found: error

  amo-listing:
    name: Submit to Mozilla Add-ons
    needs: extension-zip
    # Same gate as the Chrome job and the GitHub Release: a real tag, or a workflow_dispatch that
    # names one. Independent of both, so an AMO hiccup never blocks the release and vice-versa.
    # No-ops cleanly until the AMO credentials exist, so it is safe to merge before they do.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for AMO credentials
        id: creds
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Both, or neither. Checking only the issuer let a half-configured pair — mid-setup, or
        # mid-rotation — report itself as configured and then die further down inside mintJwt or
        # web-ext, which is neither the documented clean no-op nor a legible error.
        #
        # Exactly one present is not a no-op either: somebody plainly intended to publish and the
        # setup is broken. Skipping that silently would drop a release from AMO with nothing but a
        # green tick to show for it, so it fails here where the reason is obvious.
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$AMO_JWT_ISSUER" ] || [ -n "$AMO_JWT_SECRET" ]; then
            echo "::error::only one of AMO_JWT_ISSUER / AMO_JWT_SECRET is set — set both to publish, or neither to skip"
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMO secrets not set (AMO_JWT_ISSUER/AMO_JWT_SECRET). Skipping submission."
          fi

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          # NO explicit `ref`. That is deliberate, and the opposite of the obvious choice.
          #
          # The source archive must match the BINARY being submitted, and that binary was built by
          # the extension-zip job from ITS checkout — which is also refless. Pinning this one to
          # the tag would desynchronise the two on a workflow_dispatch that names a tag while
          # running from a branch: extension-zip would build the branch, this job would archive the
          # tag, and Mozilla would receive source that does not correspond to the add-on. On the
          # normal tag-push path both resolve to the same commit anyway.
          #
          # The "source matches the package" step below turns that from a comment into a check.
          fetch-depth: 0

      - name: Download extension zip (Firefox)
        if: steps.creds.outputs.configured == 'true'
        # The FIREFOX artifact specifically. The Chrome zip is a separate artifact and must stay
        # out of this directory — signing the Chrome package would submit a manifest with no
        # browser_specific_settings, no data_collection_permissions, and a service_worker key
        # Firefox does not support.
        uses: actions/download-artifact@v4
        with:
          name: extension-firefox-zip
          path: ff-zip

      - name: Unpack the exact package the release ships
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ZIP=$(ls ff-zip/*.zip | head -n1)
          echo "signing $ZIP"
          mkdir -p dist-firefox
          unzip -q "$ZIP" -d dist-firefox
          # web-ext signs a DIRECTORY, so unpack rather than rebuild. Rebuilding here would risk
          # submitting bytes that differ from the zip attached to the GitHub Release.
          test -f dist-firefox/manifest.json || { echo "::error::manifest.json is not at the archive root"; exit 1; }
          VERSION=$(node -p "require('./dist-firefox/manifest.json').version")
          # Everything downstream treats this value as authoritative, so it is checked where it
          # enters. Validated by the tested module rather than a shell glob: the glob this replaced
          # (`[0-9]*.[0-9]*`) accepted 0abc.9xyz, 2.01, 1.2-beta and `1.2 && curl evil.example`.
          # `node -p` also prints the string "undefined" for a missing key, which is truthy here.
          if ! node extension/scripts/amoApi.mjs check-version "$VERSION"; then
            echo "::error::package manifest has no usable version (got '${VERSION}')"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "submitting version $VERSION"

      - name: Build the human-readable source archive
        if: steps.creds.outputs.configured == 'true'
        # Mandatory for this add-on, not optional: the shipped bundles are minified, and AMO
        # rejects a submission whose code a reviewer cannot read. `git archive` takes only
        # committed files, so no node_modules, no build output, and nothing gitignored travels.
        # extension/BUILD.md sits at the root of the result and carries the build instructions
        # Mozilla requires.
        run: |
          set -euo pipefail
          git archive --format=zip -o amo-source.zip HEAD:extension

          # Deliberately NOT `unzip -l ... | grep -q`. `grep -q` exits on its first match, unzip
          # takes SIGPIPE and exits 141, and `set -o pipefail` above makes the whole pipeline fail
          # — so the guard reported "BUILD.md missing" on an archive that contained it, 20 runs out
          # of 20, blocking every credentialed submission before the upload.
          #
          # grep reading a FILE has no pipe to break, and -x matches a whole line, so a stray
          # `docs/BUILD.md.bak` cannot satisfy the guard either.
          unzip -Z1 amo-source.zip > amo-source-listing.txt
          grep -qx "BUILD.md" amo-source-listing.txt || {
            echo "::error::BUILD.md missing from the source archive root — AMO requires build instructions in it"
            exit 1
          }
          ls -lh amo-source.zip

      - name: Check the source matches the package
        if: steps.creds.outputs.configured == 'true'
        # Submitting source that does not correspond to the binary is a policy violation, and the
        # way it happens is mundane: a workflow_dispatch naming a tag while the checkout resolves
        # to a branch. Comparing the version in the checked-out manifest against the one inside the
        # downloaded artifact catches exactly that, before anything reaches Mozilla.
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(node -p "require('./extension/manifest.json').version")
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::source tree is version ${SOURCE_VERSION} but the package is ${VERSION} — refusing to submit mismatched source"
            exit 1
          fi
          echo "source and package agree on ${VERSION}"

      - name: Has AMO already got this version?
        if: steps.creds.outputs.configured == 'true'
        id: existing
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Makes the job RE-RUNNABLE, which matters more than it sounds. Re-running a release after
        # one job fails is routine, and AMO refuses a version number it already holds: without this
        # check, the second run turns a perfectly good submission into a red release, and the only
        # way to get green is to burn a version number.
        #
        # `has-version` exits 2 when it cannot tell (auth failure, AMO outage, non-JSON). That is
        # NOT treated as "no": guessing wrong in that direction is what causes the duplicate.
        run: |
          set -euo pipefail
          ADDON_ID="dfir-companion@hasamba.github.io"
          if ! ANSWER=$(node extension/scripts/amoApi.mjs has-version "$ADDON_ID" "$VERSION"); then
            echo "::error::could not ask AMO whether it already holds ${VERSION} — stopping rather than risking a duplicate submission"
            exit 1
          fi
          echo "amo has-version -> $ANSWER"
          if [ "$ANSWER" = "yes" ]; then
            echo "::notice::AMO already holds version ${VERSION}; skipping the upload. This run is a no-op, not a failure."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to AMO
        if: steps.creds.outputs.configured == 'true' && steps.existing.outputs.skip != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --approval-timeout 0 is what keeps this job from hanging. A listed submission goes to
        # HUMAN review, which takes hours to days; without it web-ext waits for approval and the
        # job burns its timeout on a submission that already succeeded.
        run: |
          set -euo pipefail
          npx --yes web-ext@10.6.0 sign \
            --source-dir dist-firefox \
            --channel listed \
            --upload-source-code amo-source.zip \
            --approval-timeout 0

      - name: Verify AMO accepted the version
        if: steps.creds.outputs.configured == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # The real safety net, mirroring the Chrome job: web-ext exiting 0 is not proof AMO holds
        # the version. This asks AMO. It runs on the skipped path too, so a re-run still ends by
        # confirming the version is really there rather than assuming the earlier run left it.
        #
        # What it proves is "accepted for review" — the most a tag can achieve. A human reviewer
        # still has to approve the version before anyone can install it.
        run: |
          set -euo pipefail
          ADDON_ID="dfir-companion@hasamba.github.io"
          if ! ANSWER=$(node extension/scripts/amoApi.mjs has-version "$ADDON_ID" "$VERSION"); then
            echo "::error::could not confirm with AMO that version ${VERSION} was accepted"
            exit 1
          fi
          if [ "$ANSWER" != "yes" ]; then
            echo "::error::AMO does not list version ${VERSION} after upload"
            exit 1
          fi
          echo "::notice::AMO holds version ${VERSION}, accepted for review. A human reviewer must approve it before users can install it."

  chrome-webstore:
    name: Publish to Chrome Web Store
    needs: extension-zip
    # Same gate as the GitHub Release: a real tag, or a workflow_dispatch that names one.
    # Runs independently of the `release` job so a Web Store hiccup never blocks the GitHub
    # Release (and vice-versa). No-ops cleanly until the store OAuth secrets are configured,
    # so it's safe to merge before the developer account / credentials exist (#138).
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for Web Store credentials
        id: creds
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
        run: |
          if [ -n "$CWS_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store secrets not set (CHROME_CLIENT_ID/CHROME_CLIENT_SECRET/CHROME_REFRESH_TOKEN/CHROME_EXTENSION_ID). Skipping upload."
          fi

      - name: Download extension zip
        if: steps.creds.outputs.configured == 'true'
        # The Chrome artifact only — `extension-firefox-zip` is a separate artifact and must stay
        # out of this directory, since the resolve step below just takes the first zip it finds.
        uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: ext-zip

      - name: Resolve zip path
        if: steps.creds.outputs.configured == 'true'
        id: zip
        run: echo "path=$(ls ext-zip/*.zip | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload + publish (listed)
        if: steps.creds.outputs.configured == 'true'
        # The upload succeeds and the Store auto-publishes on upload for already-public listed
        # items; the action's separate `publish` call then gets an expected 400 because there's
        # nothing left to publish. continue-on-error here is just plumbing so the job can reach
        # the verification step below — it does NOT decide success/failure. The "Verify Chrome
        # Web Store publish" step is the real safety net: it checks the store's live version
        # against manifest.json and fails the job for real if the upload didn't actually land.
        continue-on-error: true
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.zip.outputs.path }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Listed extension: submit the new version for publication after upload (#138).
          publish: true

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Verify Chrome Web Store publish
        if: steps.creds.outputs.configured == 'true'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail

          # --data-urlencode (not -d) is required: refresh tokens routinely contain "+", which
          # is the form-encoding escape for a space — sending it raw silently corrupts the token
          # and the token endpoint returns 400 invalid_grant.
          TOKEN_RESPONSE=$(curl -s -w '\n%{http_code}' -X POST https://oauth2.googleapis.com/token \
            --data-urlencode client_id="$CLIENT_ID" \
            --data-urlencode client_secret="$CLIENT_SECRET" \
            --data-urlencode refresh_token="$REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token)
          TOKEN_HTTP_CODE=$(echo "$TOKEN_RESPONSE" | tail -n1)
          TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | sed '$d')

          if [ "$TOKEN_HTTP_CODE" != "200" ]; then
            echo "::error::Chrome Web Store token exchange failed (HTTP $TOKEN_HTTP_CODE): $TOKEN_BODY"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$TOKEN_BODY" | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "::error::Chrome Web Store token exchange returned no access_token: $TOKEN_BODY"
            exit 1
          fi

          # The Chrome Web Store API requires a projection param on items.get, even though
          # "DRAFT" is a historical name — it's the only supported value, not an indication
          # this returns unpublished-draft data instead of the live listing.
          ITEM_RESPONSE=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID?projection=DRAFT")
          ITEM_HTTP_CODE=$(echo "$ITEM_RESPONSE" | tail -n1)
          ITEM_BODY=$(echo "$ITEM_RESPONSE" | sed '$d')

          if [ "$ITEM_HTTP_CODE" != "200" ]; then
            echo "::error::Chrome Web Store item lookup failed (HTTP $ITEM_HTTP_CODE): $ITEM_BODY"
            exit 1
          fi

          LIVE_VERSION=$(echo "$ITEM_BODY" | jq -r '.crxVersion // "unknown"')
          EXPECTED_VERSION=$(jq -r '.version' extension/manifest.json)
          echo "Chrome Web Store live version: $LIVE_VERSION (expected: $EXPECTED_VERSION)"

          if [ "$LIVE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Chrome Web Store item is at version $LIVE_VERSION, expected $EXPECTED_VERSION — the upload/publish did not actually go through. Check the Chrome Web Store Developer Dashboard."
            exit 1
          fi

          echo "Confirmed: Chrome Web Store is serving v$EXPECTED_VERSION."

  release:
    name: Attach to GitHub Release
    needs: [windows-exe, linux-appimage, extension-zip]
    # Only publish a Release for a real tag push, or a manual run that explicitly names a tag.
    # A tagless workflow_dispatch (e.g. a branch build to test artifacts) builds + uploads them
    # but does NOT create a junk release named after the branch.
    #
    # `!cancelled()` is load-bearing. With a bare `needs`, ONE failed build job skips this one and
    # every artifact that DID build is thrown away. That is precisely how v0.35.0 and the first
    # v0.35.1 both published with no downloads: the Windows job failed, and the Linux AppImage and
    # both extension zips — already built and uploaded — went with it.
    #
    # Publish whatever was produced. The check below names anything missing, and still fails the
    # job if NOTHING built, so a silently empty release is not possible.
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      # Decide what is coherent to publish. A partial release must be loud, and some partials are
      # not releasable at all.
      - name: Decide what to publish
        id: pick
        shell: bash
        run: |
          have() { compgen -G "artifacts/$1/*" > /dev/null; }
          missing=(); files=()

          # The server binaries are independent deliverables: a Linux-only release is coherent, and
          # so is a Windows-only one. Publish whichever built.
          for a in windows-exe linux-appimage; do
            if have "$a"; then files+=("artifacts/$a/*"); else missing+=("$a"); fi
          done

          # The two extension zips are ONE deliverable in two packagings, and the job that builds
          # them uploads Chrome BEFORE it builds Firefox. So a Firefox build failure leaves Chrome
          # uploaded and Firefox absent — and shipping that gives Chrome users an update that does
          # not exist for Firefox users, off one release tag. All or neither.
          if have extension-zip && have extension-firefox-zip; then
            files+=("artifacts/extension-zip/*" "artifacts/extension-firefox-zip/*")
          else
            have extension-zip || missing+=("extension-zip")
            have extension-firefox-zip || missing+=("extension-firefox-zip")
            if have extension-zip || have extension-firefox-zip; then
              echo "::warning::only one extension packaging built — publishing NEITHER, because half an extension is worse than none"
            fi
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::nothing publishable was built — refusing to publish an empty release"
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::publishing WITHOUT: ${missing[*]} — check the build job(s) for those"
          fi
          printf 'files<<PICK_EOF\n%s\nPICK_EOF\n' "$(printf '%s\n' "${files[@]}")" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Fallback so the release body is never silently empty if the version heading isn't found.
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          # Exactly what the "Decide what to publish" step judged coherent — never a fixed list,
          # so a half-built extension cannot reach the release by being globbed in.
          files: ${{ steps.pick.outputs.files }}
          # false, because a missing platform must not abort the upload of the platforms that DID
          # build. The "Decide what to publish" step above is what makes the gap visible, and it
          # already fails the job if nothing built at all.
          fail_on_unmatched_files: false
          # Don't auto-create; the release is published manually per CLAUDE.md.
          draft: false
          prerelease: false

      # "Decide what to publish" governs what we ATTEMPT to upload. It cannot govern what actually
      # lands: assets upload one at a time, so an API or network failure partway can attach the
      # Chrome zip and not the Firefox one — the very state the pairing rule exists to prevent,
      # reached from the other direction. A re-run against an existing tag can leave the same
      # residue. So the invariant is enforced against what the release REALLY holds.
      #
      # `always()` because this matters most when the upload step failed.
      - name: Enforce the extension pair on the published release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"

          # An unreadable release must NOT read as a clean pair. Swallowing the query failure left
          # `assets` empty, which scored chrome=0 firefox=0 and reported "consistent" — a guard that
          # passes loudest exactly when it has learned nothing.
          #
          # "Release not found" is different, and legitimate: the tag build runs before the release
          # is created by hand, so there is genuinely nothing published to reconcile.
          err=$(mktemp)
          if assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>"$err"); then
            :
          elif grep -qi 'release not found' "$err"; then
            echo "::notice::release $TAG does not exist yet — nothing published, nothing to reconcile"
            rm -f "$err"; exit 0
          else
            echo "::error::could not read release $TAG — cannot verify the extension pair: $(cat "$err")"
            rm -f "$err"; exit 1
          fi
          rm -f "$err"

          ext=$(printf '%s\n' "$assets" | grep '^dfir-capture-extension-' || true)
          # The Firefox zip also starts with that prefix, so "-firefox-" is what separates them.
          firefox=$(printf '%s\n' "$ext" | grep -- '-firefox-' || true)
          chrome=$(printf '%s\n' "$ext" | grep -v -- '-firefox-' || true)
          nf=$(printf '%s' "$firefox" | grep -c . || true); nf=${nf:-0}
          nc=$(printf '%s' "$chrome" | grep -c . || true); nc=${nc:-0}
          if { [ "$nc" -gt 0 ] && [ "$nf" -eq 0 ]; } || { [ "$nf" -gt 0 ] && [ "$nc" -eq 0 ]; }; then
            echo "::error::release $TAG carries one extension packaging but not the other (chrome=$nc firefox=$nf) — removing the orphan so nobody installs half an update"
            printf '%s\n%s\n' "$chrome" "$firefox" | grep . | while read -r a; do
              echo "deleting orphaned asset: $a"
              gh release delete-asset "$TAG" "$a" --yes || echo "::warning::could not delete $a — delete it by hand"
            done
            exit 1
          fi
          echo "extension pair consistent (chrome=$nc firefox=$nf)"

  chocolatey:
    name: Publish Chocolatey package
    # Runs after the release assets exist (so first-install moderation can fetch them) and reads
    # the portable zip's + extension zip's SHA256 from the windows-exe and extension-zip jobs.
    # Same tag gate as the release; the push is a no-op until the CHOCOLATEY_API_KEY secret is
    # set, so it's safe to merge beforehand (#137).
    needs: [windows-exe, extension-zip, release]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build + pack package
        working-directory: companion
        shell: pwsh
        run: |
          node scripts/build-choco.mjs `
            --version "${{ steps.ver.outputs.version }}" `
            --checksum "${{ needs.windows-exe.outputs.sha256 }}" `
            --ext-checksum "${{ needs.extension-zip.outputs.sha256 }}" `
            --out dist-choco `
            --pack

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-nupkg
          path: companion/dist-choco/*.nupkg
          if-no-files-found: error

      - name: Attach nupkg to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: companion/dist-choco/*.nupkg
          draft: false
          prerelease: false

      - name: Check for Chocolatey API key
        id: creds
        env:
          CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh
        run: |
          if ($env:CHOCO_KEY) {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::CHOCOLATEY_API_KEY secret not set — skipping push to the Chocolatey community repo. The .nupkg is still attached to the release."
          }

      - name: Push to Chocolatey community repo
        if: steps.creds.outputs.configured == 'true'
        working-directory: companion
        shell: pwsh
        env:
          CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $pkg = Get-ChildItem dist-choco\*.nupkg | Select-Object -First 1
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_KEY
