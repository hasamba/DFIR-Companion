name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A second push to an open PR used to start a SECOND review beside the still-running first — both
# holding issues:write and an OIDC token, both posting to the same PR. ci.yml has cancelled its own
# superseded runs since it was written; this workflow never did (#1538). Keyed on the PR's ref, so
# reviews of different PRs still run side by side.
concurrency:
  group: opencode-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default. Across the 15 runs measured in #1538 the
    # median was ~4 minutes and the tail was 11, 25 and 56 — a review running that long is hung, not
    # thorough, and it holds a runner until someone happens to look. 15 is roughly 3x the median and
    # above every run in that sample except the three outliers this exists to cut off.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      # #817's commit-pin policy deliberately covers third-party actions only (below) — GitHub's own
      # actions/checkout is lower supply-chain risk, and every workflow in this repo tracks it by a
      # moving major-version tag, not a commit SHA (#1192).
      - uses: actions/checkout@v6

      # Pinned to a commit, not a moving ref (#817): whatever `@latest` points at tomorrow would run
      # here with issues:write and an OIDC token. This is the commit `latest` resolved to on
      # 2026-09-04 (tag github-v1.2.19). Bump deliberately, checking the action's diff.
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI-only permission overrides: no interactive prompts in headless runs.
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode/ci.json
        with:
          model: "ollama-cloud/kimi-k2.7-code"
          use_github_token: true
          prompt: |
            Review the changes in this pull request (#${{ github.event.pull_request.number }}).

            Approve or request changes through the normal GitHub PR review
            mechanism, based only on whether the change is safe and correct
            to merge. Put every finding in the review itself. Do not create
            GitHub issues, and do not run `gh issue create`.
