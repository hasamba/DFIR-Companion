name: AI-agent rule pack publish

# Publishes the AI Agent Forensics rules (companion/data/ai-agent-rules, vendored from
# depalmar/ai-dfir-toolkit) as their own rule pack, released separately from the app (#2690). The
# companion's AI Agent Forensics panel checks these releases, verifies them and installs one only when
# the analyst clicks Install.
#
#   - Runs on a push to master that changes the rule folder, and on demand. A push that leaves every
#     file unchanged publishes nothing: buildAiAgentPack.mjs compares with the newest pack's manifest.
#   - Tag: aiagent-rules-YYYY.MM.DD, or .N when that day already has a pack. It never matches the
#     detection rule pack's ^rules-YYYY tag (older apps' pack check skips it) nor the app's v* tags
#     (docker-publish.yml / release-artifacts.yml trigger on v* only; rulePackWorkflow.test.ts pins it).
#   - Published with --latest=false, so the app's own release stays GitHub's "latest".
#   - Only GITHUB_TOKEN with contents: write. No other secrets.

on:
  push:
    branches: [master]
    paths:
      - "companion/data/ai-agent-rules/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even when the rules equal the newest pack (republish)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-agent-pack-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the AI-agent rule pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find the newest pack
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          taken=$(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("aiagent-rules-"))' | tr '\n' ' ')
          echo "taken=$taken" >> "$GITHUB_OUTPUT"
          latest=$(printf '%s\n' $taken | sort -V | tail -n 1)
          mkdir -p "$RUNNER_TEMP/prev"
          if [ -n "$latest" ]; then
            gh release download "$latest" --pattern ai-agent-pack-manifest.json --dir "$RUNNER_TEMP/prev" || true
          fi

      - name: Build the pack
        id: build
        env:
          TAKEN: ${{ steps.prev.outputs.taken }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
        run: |
          node companion/scripts/buildAiAgentPack.mjs \
            --out "$RUNNER_TEMP/pack" \
            --previous-manifest "$RUNNER_TEMP/prev/ai-agent-pack-manifest.json" \
            --taken "$TAKEN" \
            --commit "$GITHUB_SHA" \
            $FORCE

      - name: Publish the release
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          {
            echo "AI-agent rule pack $VERSION (ai-dfir-toolkit rules for AI Agent Forensics), built from commit $GITHUB_SHA."
            echo
            echo "Install it from the companion: AI Agent Forensics panel -> Rule pack -> Check for updates."
            echo "The manifest names the minimum app version, the upstream commit and the SHA-256 of every file."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" "$OUT/ai-agent-rules.json" "$OUT/ai-agent-pack-manifest.json" \
            --title "AI-agent rules $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest=false
