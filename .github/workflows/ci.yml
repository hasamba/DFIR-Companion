name: CI

# Build + test gate on every PR and push to master. These are the SAME commands the release
# (release-artifacts.yml) runs at tag time — this just runs them earlier, on a clean cloud box
# (fresh `npm ci`), so a red change is caught at the offending PR instead of at release.
#
# Each gate is its own step, and lint/format/structure live in their own JOB (#385), so the check
# name in the PR says what broke: "Companion build + test" failing means the code is wrong,
# "Companion lint + format + structure" failing means it is untidy. Merging those into one step
# would make every failure look equally alarming and train people to skim past them.
#
# The companion suite runs SHARDED across six runners per platform (#1536, #1542) — see the
# comment above `companion-test`. "Companion build + test" and "Companion test (Windows)" are
# aggregate jobs that exist to keep the required check names stable; the shard jobs are where the
# actual failures are.
#
# Node 22 to match release-artifacts.yml / docker-publish.yml and the Node 22.5+ case-storage floor.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch cancels the previous, still-running CI for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates, separated from build+test so a red check names the thing that is actually wrong
  # (#385). They run as their own job rather than as extra steps on `companion` for two reasons:
  # they are fast and fail early, and a formatting nit must never mask a broken build in the UI.
  companion-quality:
    name: Companion lint + format + structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # format:check diffs against the merge base with master. The default shallow clone has no
          # merge base, so the check would silently degrade to "no changed files" and pass always.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      # Typed rules (no-floating-promises, request-boundary validation, the forbidden unbounded
      # timeline read from #373). See companion/eslint.config.mjs for what each rule is for.
      - name: Lint (eslint)
        working-directory: companion
        run: npm run lint

      # Only files this branch changed, so adopting Prettier did not require reformatting 877 files.
      # See the header of companion/scripts/format-changed.mjs.
      - name: Format check (prettier, changed files)
        working-directory: companion
        run: npm run format:check

      # Ratchets that #384 (decompose pipeline.ts) needs in place before it can enforce anything:
      # no source file may grow past its recorded size, and no NEW runtime import cycle may appear.
      - name: File-size ratchet
        working-directory: companion
        run: npm run check:size

      - name: Circular-import ratchet
        working-directory: companion
        run: npm run check:imports

      # The module map from #384: every src/ file has a domain, and an import may go down a layer or
      # sideways within one, never up. See ARCHITECTURE.md for the map and companion/scripts/
      # module-map.json for what CI actually reads.
      - name: Module-boundary ratchet
        working-directory: companion
        run: npm run check:boundaries

      # A built-in prompt or default model can compile perfectly while making investigations worse.
      # When either changes, #378 requires a hash-pinned real-model no-regression attestation.
      - name: AI prompt/model no-regression gate
        working-directory: companion
        run: npm run eval:change-gate

      # Keeps the browser suite's coverage claims honest: every "// Covers: US-xxx" banner must name
      # a story that exists, and feature-user-stories.csv's browser_test column must agree with the
      # specs in both directions. A coverage table that is quietly wrong reads as "this is tested".
      # Lives here rather than in the E2E job because it is a static check — it runs no browser.
      - name: User-story mapping
        working-directory: companion
        run: npm run check:us-map

  # The companion suite is 1076 files and ~10 minutes on a single runner, and that WAS the cost of
  # a PR gate: of the 11 minutes this job took, `npm test` was 10 of them. Sharding splits the test
  # FILES across runners (#1536). Free here — the repo is public, so the extra runners are not billed.
  #
  # SIX and not eight (#1542). Four shards measured 3m25s of tests plus ~50s of build and type-check;
  # six puts the test phase near 2m20s. Eight would not pay: roughly a third of a shard is now
  # vitest's collect and transform, which does not shrink with the test time, and GitHub's free tier
  # allows 20 concurrent jobs. Eight per platform is 16 test jobs plus 4 others here plus 3 from the
  # scanners and the AI review — over the limit, where jobs queue and the gain is spent waiting. Six
  # per platform is 16 in total, inside it. Raising this number again means checking that ceiling.
  #
  # Build and type-check run on every shard rather than once in a job of their own. They cost ~50s
  # against the shard's couple of minutes of tests and every shard runs at the same time, so the
  # redundancy never shows up in wall clock — and it keeps each shard a complete verification of its
  # own slice rather than something that only means anything alongside three other jobs.
  companion-test:
    name: Companion build + test (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # ~4 min observed for the whole unsharded suite. The generous multiple is deliberate: #408 moved
    # per-test timeouts from vitest's 15s default to 20-30s, so a systemic break (the background
    # pipeline not running at all) now reddens the suite in roughly twice the wall-clock
    # it used to. This bounds that without being tight enough to fail a merely slow runner.
    timeout-minutes: 25
    strategy:
      # Each shard reports its own failures. Cancelling the other three on the first red one would
      # hide the rest of the damage behind whichever shard happened to fail first, and turn one
      # push into several rounds of "fix it and find out what else broke".
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      - name: Build (tsc type-check)
        working-directory: companion
        run: npm run build

      # `npm run build` only covers src/ — it is the emit config. Without this step no test file
      # is ever type-checked, which is how CARD/PHONE/NATID went missing from four AnonPolicy
      # `categories` literals and silently disabled those detectors in the tests covering them.
      # As of #385 this covers EVERY test file: tsconfig.test.json has no exclude list.
      - name: Type-check tests (tsc)
        working-directory: companion
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: companion
        run: npm test -- --shard=${{ matrix.shard }}/6

  # The branch ruleset requires a check named exactly "Companion build + test", and a matrix renames
  # its jobs to "… (shard N/6)". This job keeps that name attached to something real, so sharding
  # needed no change to branch protection — and changing the shard count later needs none either.
  #
  # `if: always()` is load-bearing. Without it a failed shard SKIPS this job instead of failing it,
  # and a skipped required check does not block a merge.
  companion:
    name: Companion build + test
    runs-on: ubuntu-latest
    needs: companion-test
    if: always()
    timeout-minutes: 5
    steps:
      # A matrix dependency reports ONE aggregate result, and it is "success" only when every shard
      # succeeded — so this is the whole check, not a sample of it.
      - name: Verify every shard passed
        env:
          SHARDS: ${{ needs.companion-test.result }}
        run: |
          echo "companion-test shards: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::One or more companion test shards did not pass. Open the 'Companion build + test (shard N/6)' checks to see which."
            exit 1
          fi

  # Windows is a first-class target — the release ships a Windows EXE — but until now the suite ran
  # on Windows ONLY in the tag-triggered release workflow. It rotted across the 423 commits between
  # v0.34.0 and v0.35.0 (8 files / 30 tests, all Windows-only: `.pathname` yielding "/D:/a/…",
  # `new URL()` reading "C:" as a scheme, CRLF-sensitive source assertions, reparse points read as
  # symlinks, and file-locking timeouts) and surfaced at the worst possible moment, blocking the
  # binaries for two releases running.
  #
  # It ran advisory only long enough to fix what it found — a real product bug (the export guard
  # reading the application's own atomic write as a symlink attack, which only the no-O_NOFOLLOW
  # fallback can hit) and a timeout calibrated on Linux hardware. It is a gate now: a permanently
  # red check teaches everyone to ignore CI, which is the same blindness that let Windows rot in
  # the first place.
  #
  # Sharded for the same reason as the Linux job (#1536): it is not in the ruleset, but it ran the
  # same ~10 minutes of tests and so it set the wall clock for anyone waiting on all four checks.
  companion-windows:
    name: Companion test (Windows, shard ${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      - name: Build (tsc type-check)
        working-directory: companion
        run: npm run build

      - name: Test (vitest)
        working-directory: companion
        run: npm test -- --shard=${{ matrix.shard }}/6

  # The same aggregate trick as `companion` above, for the same reason and one more (#1542): a
  # matrix has no single check name, and a check the branch ruleset can require must have one.
  #
  # The comment above `companion-windows` has claimed since it was written that the Windows suite
  # "is a gate now". It was not — the ruleset required only "Companion build + test" and "Extension
  # build + test", so Windows was advisory and a Windows-only break could land on master. That is
  # also what makes `gh pr merge --auto` unsafe without it: auto-merge fires the moment the REQUIRED
  # checks pass, which today is before the Windows shards have finished. This job gives the ruleset
  # a name to require, and the name does not change when the shard count does.
  companion-windows-all:
    name: Companion test (Windows)
    runs-on: ubuntu-latest
    needs: companion-windows
    if: always()
    timeout-minutes: 5
    steps:
      # A matrix dependency reports ONE aggregate result, "success" only when every shard succeeded.
      - name: Verify every Windows shard passed
        env:
          SHARDS: ${{ needs.companion-windows.result }}
        run: |
          echo "companion-windows shards: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::One or more Windows test shards did not pass. Open the 'Companion test (Windows, shard N/6)' checks to see which."
            exit 1
          fi

  extension:
    name: Extension build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      # Vite and Vitest only type-strip, so neither fails on a type error. Without this step a
      # type error outside an exercised test path reaches the build unnoticed (#218).
      - name: Typecheck (tsc)
        working-directory: extension
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: extension
        run: npm test

      - name: Build (vite)
        working-directory: extension
        run: npm run build

      # The release packages both targets (#366), so both are built here — otherwise a change that
      # breaks only the Firefox build (the derived manifest, a Firefox-only asset) goes unnoticed
      # until the tag, where it fails the whole release job.
      - name: Build Firefox (vite)
        working-directory: extension
        run: npm run build:firefox
