name: CI

# Build + test gate on every PR and push to master. These are the SAME commands the release
# (release-artifacts.yml) runs at tag time — this just runs them earlier, on a clean cloud box
# (fresh `npm ci`), so a red change is caught at the offending PR instead of at release.
#
# Each gate is its own step, and lint/format/structure live in their own JOB (#385), so the check
# name in the PR says what broke: "Companion build + test" failing means the code is wrong,
# "Companion lint + format + structure" failing means it is untidy. Merging those into one step
# would make every failure look equally alarming and train people to skim past them.
#
# Node 22 to match release-artifacts.yml / docker-publish.yml and the Node 22.5+ case-storage floor.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch cancels the previous, still-running CI for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates, separated from build+test so a red check names the thing that is actually wrong
  # (#385). They run as their own job rather than as extra steps on `companion` for two reasons:
  # they are fast and fail early, and a formatting nit must never mask a broken build in the UI.
  companion-quality:
    name: Companion lint + format + structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # format:check diffs against the merge base with master. The default shallow clone has no
          # merge base, so the check would silently degrade to "no changed files" and pass always.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      # Typed rules (no-floating-promises, request-boundary validation, the forbidden unbounded
      # timeline read from #373). See companion/eslint.config.mjs for what each rule is for.
      - name: Lint (eslint)
        working-directory: companion
        run: npm run lint

      # Only files this branch changed, so adopting Prettier did not require reformatting 877 files.
      # See the header of companion/scripts/format-changed.mjs.
      - name: Format check (prettier, changed files)
        working-directory: companion
        run: npm run format:check

      # Ratchets that #384 (decompose pipeline.ts) needs in place before it can enforce anything:
      # no source file may grow past its recorded size, and no NEW runtime import cycle may appear.
      - name: File-size ratchet
        working-directory: companion
        run: npm run check:size

      - name: Circular-import ratchet
        working-directory: companion
        run: npm run check:imports

      # The module map from #384: every src/ file has a domain, and an import may go down a layer or
      # sideways within one, never up. See ARCHITECTURE.md for the map and companion/scripts/
      # module-map.json for what CI actually reads.
      - name: Module-boundary ratchet
        working-directory: companion
        run: npm run check:boundaries

      # A built-in prompt or default model can compile perfectly while making investigations worse.
      # When either changes, #378 requires a hash-pinned real-model no-regression attestation.
      - name: AI prompt/model no-regression gate
        working-directory: companion
        run: npm run eval:change-gate

      # Keeps the browser suite's coverage claims honest: every "// Covers: US-xxx" banner must name
      # a story that exists, and feature-user-stories.csv's browser_test column must agree with the
      # specs in both directions. A coverage table that is quietly wrong reads as "this is tested".
      # Lives here rather than in the E2E job because it is a static check — it runs no browser.
      - name: User-story mapping
        working-directory: companion
        run: npm run check:us-map

  companion:
    name: Companion build + test
    runs-on: ubuntu-latest
    # ~4 min observed. The generous multiple is deliberate: #408 moved per-test
    # timeouts from vitest's 15s default to 20-30s, so a systemic break (the background
    # pipeline not running at all) now reddens the suite in roughly twice the wall-clock
    # it used to. This bounds that without being tight enough to fail a merely slow runner.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      - name: Build (tsc type-check)
        working-directory: companion
        run: npm run build

      # `npm run build` only covers src/ — it is the emit config. Without this step no test file
      # is ever type-checked, which is how CARD/PHONE/NATID went missing from four AnonPolicy
      # `categories` literals and silently disabled those detectors in the tests covering them.
      # As of #385 this covers EVERY test file: tsconfig.test.json has no exclude list.
      - name: Type-check tests (tsc)
        working-directory: companion
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: companion
        run: npm test

  # Windows is a first-class target — the release ships a Windows EXE — but until now the suite ran
  # on Windows ONLY in the tag-triggered release workflow. It rotted across the 423 commits between
  # v0.34.0 and v0.35.0 (8 files / 30 tests, all Windows-only: `.pathname` yielding "/D:/a/…",
  # `new URL()` reading "C:" as a scheme, CRLF-sensitive source assertions, reparse points read as
  # symlinks, and file-locking timeouts) and surfaced at the worst possible moment, blocking the
  # binaries for two releases running.
  #
  # It ran advisory only long enough to fix what it found — a real product bug (the export guard
  # reading the application's own atomic write as a symlink attack, which only the no-O_NOFOLLOW
  # fallback can hit) and a timeout calibrated on Linux hardware. It is a gate now: a permanently
  # red check teaches everyone to ignore CI, which is the same blindness that let Windows rot in
  # the first place.
  companion-windows:
    name: Companion test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      - name: Build (tsc type-check)
        working-directory: companion
        run: npm run build

      - name: Test (vitest)
        working-directory: companion
        run: npm test

  extension:
    name: Extension build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      # Vite and Vitest only type-strip, so neither fails on a type error. Without this step a
      # type error outside an exercised test path reaches the build unnoticed (#218).
      - name: Typecheck (tsc)
        working-directory: extension
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: extension
        run: npm test

      - name: Build (vite)
        working-directory: extension
        run: npm run build

      # The release packages both targets (#366), so both are built here — otherwise a change that
      # breaks only the Firefox build (the derived manifest, a Firefox-only asset) goes unnoticed
      # until the tag, where it fails the whole release job.
      - name: Build Firefox (vite)
        working-directory: extension
        run: npm run build:firefox
