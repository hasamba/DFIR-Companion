name: CI

# Build + test gate on every PR and push to master. These are the SAME commands the release
# (release-artifacts.yml) runs at tag time — this just runs them earlier, on a clean cloud box
# (fresh `npm ci`), so a red change is caught at the offending PR instead of at release.
#
# Each gate is its own step, and lint/format/structure live in their own JOB (#385), so the check
# name in the PR says what broke: "Companion build + test" failing means the code is wrong,
# "Companion lint + format + structure" failing means it is untidy. Merging those into one step
# would make every failure look equally alarming and train people to skim past them.
#
# Node 22 to match release-artifacts.yml / docker-publish.yml and the Node 22.5+ case-storage floor.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch cancels the previous, still-running CI for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates, separated from build+test so a red check names the thing that is actually wrong
  # (#385). They run as their own job rather than as extra steps on `companion` for two reasons:
  # they are fast and fail early, and a formatting nit must never mask a broken build in the UI.
  companion-quality:
    name: Companion lint + format + structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # format:check diffs against the merge base with master. The default shallow clone has no
          # merge base, so the check would silently degrade to "no changed files" and pass always.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      # Typed rules (no-floating-promises, request-boundary validation, the forbidden unbounded
      # timeline read from #373). See companion/eslint.config.mjs for what each rule is for.
      - name: Lint (eslint)
        working-directory: companion
        run: npm run lint

      # Only files this branch changed, so adopting Prettier did not require reformatting 877 files.
      # See the header of companion/scripts/format-changed.mjs.
      - name: Format check (prettier, changed files)
        working-directory: companion
        run: npm run format:check

      # Ratchets that #384 (decompose pipeline.ts) needs in place before it can enforce anything:
      # no source file may grow past its recorded size, and no NEW runtime import cycle may appear.
      - name: File-size ratchet
        working-directory: companion
        run: npm run check:size

      - name: Circular-import ratchet
        working-directory: companion
        run: npm run check:imports

  companion:
    name: Companion build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      - name: Build (tsc type-check)
        working-directory: companion
        run: npm run build

      # `npm run build` only covers src/ — it is the emit config. Without this step no test file
      # is ever type-checked, which is how CARD/PHONE/NATID went missing from four AnonPolicy
      # `categories` literals and silently disabled those detectors in the tests covering them.
      # As of #385 this covers EVERY test file: tsconfig.test.json has no exclude list.
      - name: Type-check tests (tsc)
        working-directory: companion
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: companion
        run: npm test

  # Browser-level regression coverage (#386). Its own job, same reasoning as companion-quality:
  # "Companion browser E2E" failing means a workflow broke in a real browser, which is a different
  # problem from a failed unit test and wants its own line in the PR checks.
  #
  # Chromium only for now. Firefox doubles browser download and run time on every PR; it is tracked
  # as an unmet acceptance criterion on #386 rather than silently dropped.
  companion-e2e:
    name: Companion browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      # The browser binaries live OUTSIDE node_modules (~/.cache/ms-playwright) and are ~150MB for
      # Chromium alone, so they are cached separately and keyed on the resolved Playwright version.
      # Keying on the version matters: a bump must miss the cache, or the run silently drives a
      # browser that does not match the client.
      - name: Resolve Playwright version
        id: pw
        working-directory: companion
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Runs even on a cache hit: it is a no-op when the browser is present, and --with-deps still
      # installs the OS packages, which are not part of the cached path.
      - name: Install Chromium
        working-directory: companion
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, Chromium)
        working-directory: companion
        run: npm run test:e2e

      # Compares the axe counts the run just produced against scripts/a11y-ledger.json. Its own
      # step, so a red check says "accessibility regressed" rather than "a browser test failed" —
      # they are different problems with different owners.
      - name: Accessibility ratchet
        working-directory: companion
        run: npm run check:a11y

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: companion/playwright-report/
          retention-days: 7

  extension:
    name: Extension build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      # Vite and Vitest only type-strip, so neither fails on a type error. Without this step a
      # type error outside an exercised test path reaches the build unnoticed (#218).
      - name: Typecheck (tsc)
        working-directory: extension
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: extension
        run: npm test

      - name: Build (vite)
        working-directory: extension
        run: npm run build

      # The release packages both targets (#366), so both are built here — otherwise a change that
      # breaks only the Firefox build (the derived manifest, a Firefox-only asset) goes unnoticed
      # until the tag, where it fails the whole release job.
      - name: Build Firefox (vite)
        working-directory: extension
        run: npm run build:firefox
